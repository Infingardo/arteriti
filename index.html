<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklist morfologico-clinica — Arterite a Cellule Giganti (GCA)</title>
    <script src="./vendor/react.production.min.js"></script>
    <script src="./vendor/react-dom.production.min.js"></script>
    <script src="./vendor/babel.min.js"></script>
    <script src="./vendor/tailwind.js"></script>
    <script src="./engine.js?v=3.7.0"></script>
    <style>
        body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Roboto','Oxygen','Ubuntu','Cantarell','Fira Sans','Droid Sans','Helvetica Neue',sans-serif; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }
        .cb-disabled { opacity:0.4; cursor:not-allowed; pointer-events:none; }
    </style>
</head>
<body>
<div id="root"><div style="padding:40px;font-family:sans-serif;color:#333;text-align:center"><p style="font-size:16px">⏳ Caricamento in corso...</p><p style="font-size:12px;color:#999;margin-top:8px">Il tool usa React + Babel CDN. Se questo messaggio persiste oltre 10 secondi, ricaricare la pagina.</p></div></div>
<script>
window.addEventListener('error', function(e){
    document.getElementById('root').innerHTML = '<div style="padding:20px;color:red;font-family:monospace;font-size:12px"><strong>ERRORE JS:</strong><br>' + e.message + '<br>Linea: ' + e.lineno + '</div>';
});
</script>
<script type="text/babel">
    const { useState } = React;

    /* ── ICONE ─────────────────────────────────────────────────────────── */
    const AlertCircle = ({className,size=24}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>;
    const CheckCircle = ({className,size=24}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>;
    const Info = ({className,size=24}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>;
    const RotateCcw = ({className,size=24}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>;
    const TriangleAlert = ({className,size=24}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>;
    const Ban = ({className,size=24}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>;

    /* ── COMPONENTE ─────────────────────────────────────────────────────── */
    // Il motore restituisce una chiave; la scelta del componente e' della pagina.
    const ICONE = {
        alert:    <AlertCircle className="text-red-600"/>,
        check:    <CheckCircle className="text-green-600"/>,
        info:     <Info className="text-yellow-600"/>,
        ban:      <Ban className="text-gray-600"/>,
        triangle: <TriangleAlert className="text-purple-600"/>,
    };

    function GCAScorer() {
        const [sampleAdequacy, setSampleAdequacy] = useState({ length:'', arterialStructure:false, sections:'', elasticStain:false });
        const [majorFindings, setMajorFindings] = useState({ giantCells:false, granulomatous:false, elasticFragmentation:false, transmuralInflammation:false });
        const [minorFindings, setMinorFindings] = useState({ lymphocyticInfiltrate:false, intimalThickening:false, adventitialInflammation:false, neovascularization:false, focalElasticFragmentation:false, eosinophils:false });
        const [clinicalData, setClinicalData] = useState({ age:'', newHeadache:false, jawClaudication:false, visualSymptoms:false, esr:'', crp:false, haloSign:false, onSteroids:false, steroidDays:'' });
        const [ihcMarkers, setIhcMarkers] = useState({ cd68:false, cd4:false, cd8:false, cd3:false, cd20:false });
        const [redFlags, setRedFlags] = useState({ atypicalLymphoid:false, necrotizingGranulomas:false, necrotizingVasculitis:false });
        const [refertoOverride, setRefertoOverride] = useState(null); // null = usa auto-generato; stringa = testo editato manualmente

        // ── MODALITÀ DATI CLINICI ───────────────────────────────────────
        // 'full'    → dati clinici completi      → pesi 60% isto / 40% clinico
        // 'partial' → dati parziali/frammentari  → pesi 80% isto / 20% clinico
        // 'none'    → solo istologia             → peso 100% isto, soglie ricalibrate
        // v3.7.0: era useState('full'), cioe' il default contava come ASSENTI tutti i
        // campi clinici mai compilati, col 40% del peso: una GCA da manuale senza dati
        // clinici usciva "BIOPSIA A BASSA CONCORDANZA CON GCA". Ora la modalita' segue
        // i dati effettivamente presenti finche' l'utente non ne sceglie una a mano.
        const [clinicalModeManual, setClinicalModeManual] = useState(null);
        const clinicalMode   = clinicalModeManual !== null ? clinicalModeManual : suggestClinicalMode(clinicalData);
        const clinicalModeAuto = clinicalModeManual === null;
        const setClinicalMode = setClinicalModeManual;
        const [importedFrom, setImportedFrom] = useState(null); // null | { medico, paziente, data }

        /* ── IMPORTA DATI CLINICI DA FILE JSON ──────────────────────────── */
        const importaDatiClinici = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    const d = JSON.parse(ev.target.result);
                    if (!d._versione || !d._versione.startsWith('GCA-form')) {
                        alert('File non riconosciuto. Assicurarsi di usare il modulo clinico GCA.');
                        return;
                    }
                    // Popola dati clinici
                    const s = d.sintomi || {};
                    const l = d.laboratorio || {};
                    const img = d.imaging || {};
                    const st = d.steroidi || {};
                    const eta = d.paziente?.ddn
                        ? Math.floor((new Date() - new Date(d.paziente.ddn)) / 31557600000)
                        : '';
                    setClinicalData({
                        age:           isNaN(eta) ? '' : String(eta),
                        newHeadache:   !!s.cefalea,
                        jawClaudication: !!s.claudicatio,
                        visualSymptoms: !!s.visus,
                        esr:           l.ves || '',
                        crp:           !!(l.crp && parseFloat(l.crp) > 5),
                        haloSign:      !!img.haloSign,
                        onSteroids:    !!st.siSteroidi,
                        steroidDays:   st.giorni || '',
                    });
                    // Modalità automatica in base alla completezza
                    const campiCompilati = [s.cefalea, s.claudicatio, s.visus, l.ves, l.crp].filter(Boolean).length;
                    setClinicalMode(campiCompilati >= 3 ? 'full' : campiCompilati >= 1 ? 'partial' : 'none');
                    // Banner
                    setImportedFrom({
                        medico:  d.firmaRichiedente || d.paziente?.medico || 'N.D.',
                        paziente: `${d.paziente?.cognome || ''}${d.paziente?.ddn ? ' · ' + d.paziente.ddn : ''}`.trim() || 'N.D.',
                        data:    new Date(d._esportato).toLocaleDateString('it-IT'),
                    });
                    setRefertoOverride(null);
                } catch(err) {
                    alert('Errore nella lettura del file. File corrotto o formato non valido.');
                }
            };
            reader.readAsText(file);
            e.target.value = ''; // reset input
        };

        /* ── MOTORE ──────────────────────────────────────────────────────
           v3.7.0: tutta la logica sta in engine.js — nessun DOM, nessun JSX,
           eseguibile da Node (`npm test`). Qui restano stato e rendering.
           La pagina e i test percorrono la stessa identica strada: runCase(). */
        const st = { sampleAdequacy, majorFindings, minorFindings, clinicalData,
                     ihcMarkers, redFlags, clinicalMode };
        const _E                    = makeEngine(st);
        const hasArterialStructure  = _E.hasArterialStructure;
        const hasActiveInflammation = _E.hasActiveInflammation;
        const canUseElastic         = _E.canUseElastic;
        const canUseElasticFull     = _E.canUseElasticFull;
        const canUseElasticIsolated = _E.canUseElasticIsolated;
        const getWeights            = _E.getWeights;
        /* ── CALCOLI ─────────────────────────────────────────────────────── */
        const R                  = runCase(st);
        const validationWarnings = R.validationWarnings;
        const hardInconsistency  = R.hardInconsistency;
        const scores             = R.scores;
        const diagnosis          = R.diagnosis;
        const ihcRecs            = R.ihcRecs;
        const autoReferto        = R.referto;
        const refertoText        = refertoOverride !== null ? refertoOverride : autoReferto;

        const isBlockedInadequate   = diagnosis.blocked === 'inadequate';
        const isBlockedInconsistent = diagnosis.blocked === 'inconsistent';
        const isBlockedRedFlag      = scores.hasRedFlags && !isBlockedInadequate;
        const showSecondaryGCABlock = isBlockedRedFlag && !isBlockedInconsistent;

        const ab = (() => {
            switch(scores.adequacyLevel){
                case 'adequate':   return {cls:'text-green-600',  label:'ADEGUATO'};
                case 'suboptimal': return {cls:'text-yellow-600', label:'SUBOTTIMALE'};
                case 'inadequate': return {cls:'text-red-600',    label:'NON REFERTABILE'};
                case 'unknown':    return {cls:'text-gray-400',   label:'NON INSERITO'};
                default:           return {cls:'text-gray-400',   label:'—'};
            }
        })();

        // Etichette peso per display
        const { h: hw, c: cw } = getWeights();
        const weightLabel = clinicalMode === 'none'    ? '100% istologia / 0% clinica'
                          : clinicalMode === 'partial' ? '80% istologia / 20% clinica'
                          :                              '60% istologia / 40% clinica';

        const resetAll = () => {
            setSampleAdequacy({length:'',arterialStructure:false,sections:'',elasticStain:false});
            setMajorFindings({giantCells:false,granulomatous:false,elasticFragmentation:false,transmuralInflammation:false});
            setMinorFindings({lymphocyticInfiltrate:false,intimalThickening:false,adventitialInflammation:false,neovascularization:false,focalElasticFragmentation:false,eosinophils:false});
            setClinicalData({age:'',newHeadache:false,jawClaudication:false,visualSymptoms:false,esr:'',crp:false,haloSign:false,onSteroids:false,steroidDays:''});
            setIhcMarkers({cd68:false,cd4:false,cd8:false,cd3:false,cd20:false});
            setRedFlags({atypicalLymphoid:false,necrotizingGranulomas:false,necrotizingVasculitis:false});
            setClinicalModeManual(null);
            setRefertoOverride(null);
            setImportedFrom(null);
        };

        /* ── RENDER ──────────────────────────────────────────────────────── */
        return (
        <div className="max-w-6xl mx-auto p-6 bg-gradient-to-br from-blue-50 to-indigo-50 min-h-screen">

            {/* HEADER */}
            <div className="bg-white rounded-lg shadow-xl p-6 mb-6">
                <div className="flex justify-between items-center">
                    <div>
                        <h1 className="text-3xl font-bold text-indigo-900 mb-2">Checklist morfologico-clinica — Arterite a Cellule Giganti (GCA)</h1>
                        <p className="text-gray-600 text-sm">Griglia decisionale strutturata: reperti istologici · contesto clinico · coerenza interna — <em>non uno score validato</em></p>
                    </div>
                    <button onClick={resetAll} className="flex items-center space-x-2 px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg border border-gray-300" title="Azzera tutti i campi">
                        <RotateCcw size={20}/><span className="font-medium">Reset</span>
                    </button>
                </div>
                <div className="mt-4 p-3 bg-amber-50 border border-amber-300 rounded-md">
                    <p className="text-xs text-amber-800">
                        <strong>Avvertenza metodologica:</strong> Griglia decisionale euristica, non score clinico-patologico pubblicato né validato prospetticamente. I livelli di concordanza sono categorie qualitative: il numero composito è un indice orientativo, non una probabilità calibrata. <strong>Non implementa i criteri ACR/EULAR 2022 in senso stretto. La diagnosi rimane esclusiva responsabilità del patologo e del clinico refertante.</strong>
                    </p>
                </div>
            </div>

            {/* ═══ AREA CLINICA — IMPORT + MODALITÀ + DATI ═══ */}
            <div className="bg-white rounded-lg shadow-md p-5 mb-6 border-2 border-blue-300">
                <div className="flex items-center justify-between gap-4 mb-4">
                    <div>
                        <h2 className="text-lg font-bold text-blue-900">1. Dati Clinici</h2>
                        <p className="text-xs text-gray-500 mt-0.5">Inserire manualmente o importare dal modulo clinico</p>
                    </div>
                    <label className="cursor-pointer flex items-center gap-2 px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold rounded-md whitespace-nowrap shadow">
                        <span>📂 Importa dati clinici</span>
                        <input type="file" accept=".json" onChange={importaDatiClinici} className="hidden"/>
                    </label>
                </div>
                {importedFrom && (
                    <div className="mb-4 p-2 bg-green-50 border border-green-300 rounded text-xs text-green-800">
                        <p className="font-semibold">✓ Dati clinici importati</p>
                        <p className="mt-0.5">Paziente: <strong>{importedFrom.paziente}</strong> · Medico: <strong>{importedFrom.medico}</strong> · {importedFrom.data}</p>
                        <p className="mt-1 italic text-green-700">Verificare i dati precompilati prima di procedere.</p>
                    </div>
                )}
                {/* Selettore modalità inline */}
                <div className="grid grid-cols-3 gap-2 mb-4">
                    {[
                        {val:'full',    label:'Dati completi',  sub:'60% isto · 40% clinica',          active:'border-indigo-500 bg-indigo-50', text:'text-indigo-600'},
                        {val:'partial', label:'Dati parziali',  sub:'80% isto · 20% clinica',          active:'border-orange-500 bg-orange-50', text:'text-orange-600'},
                        {val:'none',    label:'Solo istologia', sub:'100% isto · soglie ricalibrate',   active:'border-red-500 bg-red-50',      text:'text-red-600'},
                    ].map(({val,label,sub,active,text})=>(
                        <label key={val} className={`flex items-start space-x-2 p-2 rounded-lg border-2 cursor-pointer transition-all ${clinicalMode===val ? active : 'border-gray-200 hover:border-gray-300'}`}>
                            <input type="radio" name="clinicalMode" value={val} checked={clinicalMode===val} onChange={()=>setClinicalMode(val)} className="mt-0.5"/>
                            <div>
                                <p className="font-semibold text-gray-800 text-xs">{label}</p>
                                <p className={`text-xs font-mono mt-0.5 ${clinicalMode===val ? text : 'text-gray-400'}`}>{sub}</p>
                            </div>
                        </label>
                    ))}
                </div>
                {clinicalModeAuto && (
                    <p className="text-xs text-indigo-700 italic mb-2">Modalità scelta automaticamente in base ai campi clinici compilati. Selezionarne una per fissarla a mano.</p>
                )}
                {clinicalMode !== 'none' && (
                    <p className="text-xs text-amber-700 mb-2">⚠ I campi clinici non compilati sono conteggiati come <strong>assenti</strong>, non come sconosciuti: lo score composito sottostima la probabilità reale finché la scheda clinica non è completa.</p>
                )}
                {clinicalMode === 'none' && (
                    <p className="text-xs text-red-600 italic mb-3">I dati inseriti non contribuiscono allo score composito ma vengono mostrati nel riepilogo.</p>
                )}
                {/* Campi clinici */}
                <div className={`${clinicalMode==='none' ? 'opacity-60' : ''}`}>
                    <div className="grid grid-cols-2 gap-3 mb-3">
                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">Età paziente (anni)</label>
                            <input type="number" value={clinicalData.age} onChange={e=>setClinicalData({...clinicalData,age:e.target.value})}
                                className="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500" placeholder="es. 72"/>
                        </div>
                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">VES (mm/h)</label>
                            <input type="number" value={clinicalData.esr} onChange={e=>setClinicalData({...clinicalData,esr:e.target.value})}
                                className="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500" placeholder="es. 95"/>
                        </div>
                    </div>
                    <div className="grid grid-cols-2 gap-2 mb-2">
                        {[['newHeadache','Cefalea di nuova insorgenza'],['jawClaudication','Claudicatio mascellare'],
                          ['visualSymptoms','Disturbi visivi (amaurosi, diplopia, perdita visus)'],
                          ['crp','PCR elevata'],['haloSign','Halo sign ecografico positivo']
                        ].map(([key,label])=>(
                            <label key={key} className="flex items-center space-x-2 cursor-pointer">
                                <input type="checkbox" checked={clinicalData[key]} onChange={e=>setClinicalData({...clinicalData,[key]:e.target.checked})}
                                    className="w-4 h-4 text-indigo-600 rounded"/>
                                <span className="text-sm text-gray-700">{label}</span>
                            </label>
                        ))}
                    </div>
                    <label className="flex items-center space-x-2 cursor-pointer mt-1">
                        <input type="checkbox" checked={clinicalData.onSteroids} onChange={e=>setClinicalData({...clinicalData,onSteroids:e.target.checked})}
                            className="w-4 h-4 text-indigo-600 rounded"/>
                        <span className="text-sm text-gray-700">Terapia steroidea già iniziata</span>
                    </label>
                    {clinicalData.onSteroids && (
                        <div className="ml-6 mt-2">
                            <label className="block text-sm font-medium text-gray-700 mb-1">Giorni di terapia steroidea</label>
                            <input type="number" value={clinicalData.steroidDays} onChange={e=>setClinicalData({...clinicalData,steroidDays:e.target.value})}
                                className="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500" placeholder="es. 5"/>
                            <p className="text-xs text-gray-500 mt-1">Sensibilità bioptica ridotta già dopo 3–5 gg; sostanzialmente dopo 14 gg (Ing et al. 2019)</p>
                        </div>
                    )}
                </div>
            </div>

            <div className="grid md:grid-cols-2 gap-6">

            {/* ═══ COLONNA SINISTRA ═══ */}
            <div className="space-y-6">

                {/* 1. ADEGUATEZZA */}
                <div className="bg-white rounded-lg shadow-md p-5">
                    <h2 className="text-xl font-bold text-gray-800 mb-4 border-b pb-2">2. Adeguatezza Campione</h2>
                    <div className="space-y-3">
                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">Lunghezza frammento (mm)</label>
                            <input type="number" step="0.5" value={sampleAdequacy.length}
                                onChange={e=>setSampleAdequacy({...sampleAdequacy,length:e.target.value})}
                                className="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500" placeholder="es. 15"/>
                            <p className="text-xs text-gray-500 mt-1">Ottimale ≥10 mm (ideale 15–20 mm). <span className="text-amber-700 font-medium">Una biopsia negativa su frammento &lt;10 mm ha scarso valore esclusivo.</span></p>
                        </div>
                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">Numero sezioni analizzate</label>
                            <input type="number" value={sampleAdequacy.sections}
                                onChange={e=>setSampleAdequacy({...sampleAdequacy,sections:e.target.value})}
                                className="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500" placeholder="es. 15"/>
                            <p className="text-xs text-gray-500 mt-1">Minimo 6, raccomandato ≥10 sezioni seriali</p>
                        </div>
                        <label className="flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox" checked={sampleAdequacy.arterialStructure}
                                onChange={e=>setSampleAdequacy({...sampleAdequacy,arterialStructure:e.target.checked})}
                                className="w-4 h-4 text-indigo-600 rounded"/>
                            <span className="text-sm text-gray-700">Struttura arteriosa presente (intima-media-avventizia identificabili)</span>
                        </label>
                        <label className="flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox" checked={sampleAdequacy.elasticStain}
                                onChange={e=>setSampleAdequacy({...sampleAdequacy,elasticStain:e.target.checked})}
                                className="w-4 h-4 text-indigo-600 rounded"/>
                            <span className="text-sm text-gray-700">Colorazione elastica eseguita (Verhoeff-Van Gieson o equivalente)</span>
                        </label>
                        {!sampleAdequacy.elasticStain && (
                            <p className="text-xs text-blue-700 bg-blue-50 border border-blue-200 rounded px-2 py-1">
                                ℹ VVG non eseguita. La frammentazione elastica può essere valutata su EE, ma la VVG è raccomandata per quantificazione formale e documentazione. I punti vengono assegnati normalmente.
                            </p>
                        )}
                    </div>
                </div>

                {/* 2. REPERTI MAGGIORI */}
                <div className="bg-white rounded-lg shadow-md p-5">
                    <h2 className="text-xl font-bold text-gray-800 mb-4 border-b pb-2">
                        3. Reperti Istologici Maggiori
                        <span className="text-sm font-normal text-gray-500 ml-2">(pesi gerarchizzati per specificità)</span>
                    </h2>
                    <div className="space-y-3">
                        <label className={`flex items-start space-x-2 cursor-pointer ${!hasArterialStructure?'cb-disabled':''}`}>
                            <input type="checkbox" checked={majorFindings.giantCells}
                                onChange={e=>setMajorFindings({...majorFindings,giantCells:e.target.checked})}
                                disabled={!hasArterialStructure}
                                className="w-4 h-4 mt-0.5 text-red-600 rounded"/>
                            <span className="text-sm text-gray-700">
                                Cellule giganti multinucleate (giunzione intima-media)
                                <span className="text-xs font-semibold text-red-600 ml-1">22 pt</span>
                                {!hasArterialStructure && <span className="text-xs text-red-400 ml-1">[disabilitato: struttura assente]</span>}
                            </span>
                        </label>
                        <label className={`flex items-start space-x-2 cursor-pointer ${!hasArterialStructure?'cb-disabled':''}`}>
                            <input type="checkbox" checked={majorFindings.granulomatous}
                                onChange={e=>setMajorFindings({...majorFindings,granulomatous:e.target.checked})}
                                disabled={!hasArterialStructure}
                                className="w-4 h-4 mt-0.5 text-red-600 rounded"/>
                            <span className="text-sm text-gray-700">
                                Aggregati macrofagici organizzati centrati sulla IEL con distruzione elastica
                                <span className={`text-xs font-semibold ml-1 ${majorFindings.giantCells?'text-amber-600':'text-red-600'}`}>
                                    {majorFindings.giantCells ? '11 pt (ridotto — coesistenza CG)' : '22 pt'}
                                </span>
                                <span className="block text-xs text-gray-400">— non semplice infiltrato macrofagico diffuso</span>
                            </span>
                        </label>
                        <label className={`flex items-start space-x-2 cursor-pointer ${!canUseElastic?'cb-disabled':''}`}>
                            <input type="checkbox" checked={majorFindings.elasticFragmentation}
                                onChange={e=>setMajorFindings({...majorFindings,elasticFragmentation:e.target.checked})}
                                disabled={!canUseElastic}
                                className="w-4 h-4 mt-0.5 text-red-600 rounded"/>
                            <span className="text-sm text-gray-700">
                                Frammentazione elastica diffusa (&gt;30%) della LEI
                                {canUseElasticFull && <span className="text-xs font-semibold text-orange-600 ml-1">15 pt</span>}
                                {canUseElasticIsolated && <span className="text-xs font-semibold text-amber-600 ml-1">3 pt (isolata — con riserva)</span>}
                                {!sampleAdequacy.elasticStain && <span className="text-xs text-red-400 ml-1">[VVG non eseguita — stima su EE]</span>}
                                {canUseElasticFull && <span className="block text-xs text-gray-400">— con infiammazione attiva: criterio maggiore (15 pt)</span>}
                                {canUseElasticIsolated && <span className="block text-xs text-amber-700">— senza infiammazione attiva: 3 pt con riserva. DD: aterosclerosi, involuzione da invecchiamento, artefatto da processazione, biopsia post-steroidea. Selezionare se diffusa e su VVG inequivocabile.</span>}
                                {!sampleAdequacy.elasticStain && <span className="block text-xs text-gray-400">— richiede VVG eseguita</span>}
                            </span>
                        </label>
                        <label className={`flex items-start space-x-2 cursor-pointer ${!hasArterialStructure?'cb-disabled':''}`}>
                            <input type="checkbox" checked={majorFindings.transmuralInflammation}
                                onChange={e=>setMajorFindings({...majorFindings,transmuralInflammation:e.target.checked})}
                                disabled={!hasArterialStructure}
                                className="w-4 h-4 mt-0.5 text-red-600 rounded"/>
                            <span className="text-sm text-gray-700">
                                Infiammazione transmurale (tutti e tre gli strati)
                                <span className="text-xs font-semibold text-yellow-600 ml-1">13 pt</span>
                                {!hasArterialStructure && <span className="text-xs text-red-400 ml-1">[disabilitato: struttura assente]</span>}
                                <span className="block text-xs text-gray-400">— presente anche in PAN tardiva, vasculiti ANCA, IgG4</span>
                            </span>
                        </label>
                    </div>
                    <div className="mt-3 p-2 bg-red-50 rounded text-xs text-red-700 space-y-1">
                        <p>Per <strong>ISTOLOGIA DIAGNOSTICA</strong>: almeno CG o granulomatosa organizzata. Frammentazione + transmurale isolate → max "ALTAMENTE SUGGESTIVO".</p>
                        <p className="text-amber-700 bg-amber-50 border border-amber-200 rounded px-2 py-1">
                            <strong>Caveat elastica:</strong> La frammentazione della LEI è un criterio <em>contestuale</em>. Il danno elastico in GCA è immunomediato (macrofagi M1/M2 centrati sulla LEI): <strong>con infiammazione attiva → 15 pt</strong> (criterio maggiore). <strong>Senza infiammazione attiva → 3 pt se diffusa (&gt;30%), 2 pt se focale (&lt;30%)</strong>, sempre con riserva esplicita: il reperto isolato è morfologicamente indistinguibile da aterosclerosi accelerata, involuzione elastica da invecchiamento o artefatto da processazione. Può avere valore residuo in biopsie post-steroidee in cui l'infiltrato si è spento ma il danno strutturale persiste.
                        </p>
                    </div>
                </div>

                {/* 3. REPERTI MINORI */}
                <div className="bg-white rounded-lg shadow-md p-5">
                    <h2 className="text-xl font-bold text-gray-800 mb-4 border-b pb-2">
                        4. Reperti Istologici Minori
                        <span className="text-sm font-normal text-gray-500 ml-2">(5 pt ciascuno — aumentano sensibilità)</span>
                    </h2>
                    <div className="space-y-2">
                        {[
                            ['lymphocyticInfiltrate', 'Infiltrato linfocitario medio-intimale', false, 'caratterizzazione CD4/CD8 nel blocco IHC'],
                            ['intimalThickening',     'Ispessimento intimale concentrico significativo', !hasArterialStructure, !hasArterialStructure?'disabilitato: struttura assente':null],
                            ['adventitialInflammation','Infiammazione avventiziale/periavventiziale', false, null],
                            ['neovascularization',    'Neovascolarizzazione della parete', false, null],
                        ].map(([key, label, disabled, note]) => (
                            <label key={key} className={`flex items-start space-x-2 cursor-pointer ${disabled?'cb-disabled':''}`}>
                                <input type="checkbox" checked={minorFindings[key]}
                                    onChange={e=>setMinorFindings({...minorFindings,[key]:e.target.checked})}
                                    disabled={disabled}
                                    className="w-4 h-4 mt-0.5 text-orange-600 rounded"/>
                                <span className="text-sm text-gray-700">
                                    {label}
                                    {note && <span className={`text-xs ml-1 ${disabled?'text-red-400':'text-gray-400'}`}>— {note}</span>}
                                </span>
                            </label>
                        ))}
                        <label className={`flex items-start space-x-2 cursor-pointer ${!canUseElastic?'cb-disabled':''}`}>
                            <input type="checkbox" checked={minorFindings.focalElasticFragmentation}
                                onChange={e=>setMinorFindings({...minorFindings,focalElasticFragmentation:e.target.checked})}
                                disabled={!canUseElastic}
                                className="w-4 h-4 mt-0.5 text-orange-600 rounded"/>
                            <span className="text-sm text-gray-700">
                                Frammentazione elastica focale (&lt;30%) della LEI
                                {canUseElasticFull && <span className="text-xs font-semibold text-orange-600 ml-1">5 pt</span>}
                                {canUseElasticIsolated && <span className="text-xs font-semibold text-amber-600 ml-1">2 pt (isolata — con riserva)</span>}
                                {!sampleAdequacy.elasticStain && <span className="text-xs text-red-400 ml-1">— VVG non eseguita: stima su EE</span>}
                                {canUseElasticIsolated && <span className="block text-xs text-amber-700">— senza infiammazione attiva: 2 pt con riserva. Vedere DD sopra.</span>}
                            </span>
                        </label>
                        <label className="flex items-start space-x-2 cursor-pointer">
                            <input type="checkbox" checked={minorFindings.eosinophils}
                                onChange={e=>setMinorFindings({...minorFindings,eosinophils:e.target.checked})}
                                className="w-4 h-4 mt-0.5 text-amber-500 rounded"/>
                            <span className="text-sm text-gray-700">
                                Eosinofili intraparietali significativi
                                <span className="text-xs font-semibold text-amber-600 ml-1">→ DD alert (non score)</span>
                                <span className="block text-xs text-gray-400">— non modifica il punteggio; genera avviso di diagnosi differenziale</span>
                            </span>
                        </label>
                    </div>
                </div>

                {/* RED FLAGS */}
                <div className="bg-white rounded-lg shadow-md p-5 border-2 border-red-200">
                    <h2 className="text-xl font-bold text-red-800 mb-2 border-b border-red-200 pb-2">⚠ Reperti Inattesi / Red Flag Morfologici</h2>
                    <p className="text-xs text-red-600 mb-3">Se presenti: la categoria diagnostica GCA viene soppressa. Priorità alla caratterizzazione del reperto inatteso.</p>
                    <div className="space-y-3">
                        <label className="flex items-start space-x-2 cursor-pointer">
                            <input type="checkbox" checked={redFlags.atypicalLymphoid}
                                onChange={e=>setRedFlags({...redFlags,atypicalLymphoid:e.target.checked})}
                                className="w-4 h-4 mt-0.5 text-red-600 rounded"/>
                            <span className="text-sm text-gray-700">
                                <strong>Cellule linfoidi atipiche intravascolari</strong>
                                <span className="block text-xs text-gray-500 mt-0.5">Nucleo irregolare/ipercromico nei lumi vascolari o vasa vasorum — anche poche unità sono significative</span>
                            </span>
                        </label>
                        <label className="flex items-start space-x-2 cursor-pointer">
                            <input type="checkbox" checked={redFlags.necrotizingGranulomas}
                                onChange={e=>setRedFlags({...redFlags,necrotizingGranulomas:e.target.checked})}
                                className="w-4 h-4 mt-0.5 text-red-600 rounded"/>
                            <span className="text-sm text-gray-700">
                                <strong>Granulomi con necrosi centrale</strong>
                                <span className="block text-xs text-gray-500 mt-0.5">Necrosi fibrinoide/caseosa al centro dei granulomi — eccezionale in GCA, suggestiva di eziologia infettiva</span>
                            </span>
                        </label>
                        <label className="flex items-start space-x-2 cursor-pointer">
                            <input type="checkbox" checked={redFlags.necrotizingVasculitis}
                                onChange={e=>setRedFlags({...redFlags,necrotizingVasculitis:e.target.checked})}
                                className="w-4 h-4 mt-0.5 text-red-600 rounded"/>
                            <span className="text-sm text-gray-700">
                                <strong>Vasculite necrotizzante / infiltrato neutrofilico prominente con danno di parete</strong>
                                <span className="block text-xs text-gray-500 mt-0.5">Necrosi fibrinoide della parete vascolare o infiltrato polimorfonucleato transmurale con danno strutturale — pattern fortemente atipico per GCA classica; prioritario escludere vasculite ANCA-associata, PAN, arterite infettiva</span>
                            </span>
                        </label>
                    </div>
                </div>

                {/* 4. IHC ESEGUITA */}
                <div className="bg-white rounded-lg shadow-md p-5">
                    <h2 className="text-xl font-bold text-gray-800 mb-4 border-b pb-2">4. Marker IHC Eseguiti</h2>
                    <div className="space-y-2">
                        {[['cd68','CD68','macrofagi/cellule giganti'],['cd4','CD4','T helper — prevalente in media in GCA'],
                          ['cd8','CD8','T citotossici — prevalente in avventizia in GCA'],['cd3','CD3','pan-T'],
                          ['cd20','CD20','linfociti B — tipicamente assenti in GCA']].map(([key,name,desc])=>(
                            <label key={key} className="flex items-center space-x-2 cursor-pointer">
                                <input type="checkbox" checked={ihcMarkers[key]} onChange={e=>setIhcMarkers({...ihcMarkers,[key]:e.target.checked})}
                                    className="w-4 h-4 text-purple-600 rounded"/>
                                <span className="text-sm text-gray-700"><strong>{name}</strong> ({desc})</span>
                            </label>
                        ))}
                    </div>
                    <p className="text-xs text-purple-800 mt-3 p-2 bg-purple-50 rounded">
                        Selezionare i marker già eseguiti. L'algoritmo suggerirà eventuali integrazioni.
                    </p>
                </div>
            </div>

            {/* ═══ COLONNA DESTRA (OUTPUT) ═══ */}
            <div className="space-y-6">

                {/* AVVISI DI COERENZA */}
                {validationWarnings.length > 0 && (
                    <div className="bg-white rounded-lg shadow-md p-5 border-2 border-amber-400">
                        <h2 className="text-lg font-bold text-amber-800 mb-3 flex items-center gap-2">
                            <TriangleAlert size={20} className="text-amber-600"/>Avvisi di coerenza interna
                        </h2>
                        {hardInconsistency && (
                            <p className="text-xs font-semibold text-red-700 bg-red-50 border border-red-300 rounded px-2 py-1 mb-2">
                                ⛔ Incoerenze bloccanti presenti: la categoria diagnostica è sospesa fino alla correzione.
                            </p>
                        )}
                        <div className="space-y-2">
                            {validationWarnings.map((w,i)=>(
                                <div key={i} className={`text-xs px-3 py-2 rounded border-l-4 ${
                                    w.level==='error'  ?'bg-red-50 border-red-500 text-red-800':
                                    w.level==='warning'?'bg-yellow-50 border-yellow-500 text-yellow-800':
                                    'bg-blue-50 border-blue-400 text-blue-800'
                                }`}>
                                    {w.level==='error'&&<strong>⛔ </strong>}
                                    {w.level==='warning'&&<strong>⚠ </strong>}
                                    {w.level==='info'&&<strong>ℹ DD: </strong>}
                                    {w.text}
                                </div>
                            ))}
                        </div>
                    </div>
                )}

                {/* PUNTEGGI */}
                <div className={`bg-white rounded-lg shadow-md p-5 ${isBlockedInadequate?'opacity-50':''}`}>
                    <h2 className="text-xl font-bold text-gray-800 mb-1 border-b pb-2">
                        Indici orientativi
                        {isBlockedInadequate && <span className="text-sm font-normal text-red-600 ml-2">(istologia non applicabile)</span>}
                    </h2>
                    <p className="text-xs text-gray-400 italic mb-3">Indici euristici non validati — il giudizio morfologico su EE/VVG prevale sui numeri</p>
                    <div className="space-y-3">
                        <div className="flex justify-between items-center">
                            <span className="text-gray-700 text-sm">Indice istologico:</span>
                            <span className={`text-xl font-bold ${isBlockedInadequate?'text-gray-400':hardInconsistency?'text-gray-500':'text-red-600'}`}>
                                {scores.histoScore===null ? '—' : `${scores.histoScore}/100`}
                            </span>
                        </div>
                        <div className="w-full bg-gray-200 rounded-full h-2">
                            <div className={`h-2 rounded-full transition-all duration-500 ${isBlockedInadequate||scores.histoScore===null?'bg-gray-300':hardInconsistency?'bg-gray-400':'bg-red-500'}`}
                                style={{width:`${scores.histoScore!=null?Math.min(100,scores.histoScore):0}%`}}/>
                        </div>

                        {/* Score clinico — mostrato sempre, ma etichetta varia con la modalità */}
                        <div className="flex justify-between items-center mt-4">
                            <span className="text-gray-700 text-sm">
                                Indice clinico:
                                {clinicalMode === 'none' && <span className="text-xs text-red-500 ml-1">(non contribuisce)</span>}
                                {clinicalMode === 'partial' && <span className="text-xs text-orange-500 ml-1">(peso 20%)</span>}
                            </span>
                            <span className={`text-xl font-bold ${clinicalMode==='none'?'text-gray-400':'text-blue-600'}`}>{scores.clinicalScore}/100</span>
                        </div>
                        <div className="w-full bg-gray-200 rounded-full h-2">
                            <div className={`h-2 rounded-full transition-all duration-500 ${clinicalMode==='none'?'bg-gray-300':'bg-blue-500'}`} style={{width:`${Math.min(100,scores.clinicalScore)}%`}}/>
                        </div>
                        {isBlockedInadequate && scores.clinicalScore >= 40 && (
                            <p className="text-xs text-blue-700 bg-blue-50 border border-blue-200 rounded px-2 py-1">
                                Score clinico {scores.clinicalScore}/100 — il contesto clinico è suggestivo nonostante la biopsia non refertabile. Considerare imaging o nuovo prelievo.
                            </p>
                        )}

                        {scores.steroidOngoing && (
                            <div className="bg-amber-50 border border-amber-400 rounded-md p-2 mt-1">
                                <p className="text-xs text-amber-900 font-semibold">⚠ Terapia corticosteroidea in corso{scores.steroidDays > 0 ? ` (${scores.steroidDays} gg)` : ''}</p>
                                <p className="text-xs text-amber-800 mt-0.5">
                                    {scores.steroidDays > 14
                                        ? 'Oltre 14 gg: sensibilità bioptica sostanzialmente ridotta. Un reperto positivo conserva peso diagnostico elevato; un reperto negativo o aspecifico non esclude GCA.'
                                        : scores.steroidDays >= 7
                                        ? '7–14 gg: sensibilità ridotta in misura significativa. Interpretare la negatività con cautela.'
                                        : scores.steroidDays >= 3
                                        ? '3–6 gg: sensibilità inizialmente ridotta. Un reperto positivo resta diagnosticamente valido.'
                                        : 'Terapia precoce (durata non specificata o &lt;3 gg): impatto sulla sensibilità variabile. Nessuna correzione numerica applicata.'}
                                </p>
                            </div>
                        )}

                        {/* Composito */}
                        <div className={`mt-4 pt-4 border-t-2 border-gray-300 ${isBlockedInadequate||hardInconsistency?'opacity-60':''}`}>
                            <div className="flex justify-between items-center">
                                <span className="text-gray-900 font-semibold">Indice composito:</span>
                                <span className={`text-3xl font-bold ${isBlockedInadequate||scores.compositeScore===null?'text-gray-400 line-through':hardInconsistency?'text-gray-500 line-through':'text-indigo-600'}`}>
                                    {scores.compositeScore===null ? '—' : `${scores.compositeScore}/${scores.compositeMax}`}
                                </span>
                            </div>
                            <div className="w-full bg-gray-200 rounded-full h-4 mt-2">
                                <div className={`h-4 rounded-full transition-all duration-500 ${isBlockedInadequate||scores.compositeScore===null||hardInconsistency?'bg-gray-300':'bg-gradient-to-r from-indigo-500 to-purple-600'}`}
                                    style={{width:`${scores.compositeScore!=null&&scores.compositeMax?Math.round(scores.compositeScore/scores.compositeMax*100):0}%`}}/>
                            </div>
                            {!isBlockedInadequate && !hardInconsistency && scores.compositeScore!=null && (
                                <div className="mt-2 p-2 bg-gray-50 rounded text-xs text-gray-600 border border-gray-200">
                                    <span className="font-semibold">Contributi ({weightLabel}):</span>
                                    {' '}Istologia ({Math.round(hw*100)}%) <span className="text-red-600 font-semibold">+{scores.histoContrib}</span>
                                    {cw > 0 && <>{' '}· Clinica ({Math.round(cw*100)}%) <span className="text-blue-600 font-semibold">+{scores.clinicContrib}</span></>}
                                    {' '}— <span className={`font-semibold ${scores.driver==='morphology'?'text-red-600':scores.driver==='clinical'?'text-blue-600':'text-indigo-600'}`}>
                                        {scores.driver==='morphology'?'peso prevalente: morfologia':scores.driver==='clinical'?'peso prevalente: clinica':'morfologia e clinica bilanciate'}
                                    </span>
                                </div>
                            )}
                            {hardInconsistency && <p className="text-xs text-red-600 mt-1">⛔ Score barrato: incoerenze bloccanti attive.</p>}
                            <p className="text-xs text-gray-400 mt-1">{weightLabel} — pesi euristici, non validati prospetticamente. Massimo raggiungibile in questa modalità: <strong>{scores.compositeMax}</strong> (istologia max {scores.histoMax}, clinica max {scores.clinicalMax}).</p>
                        </div>
                    </div>
                </div>

                {/* HARD STOP — CAMPIONE NON REFERTABILE */}
                {isBlockedInadequate && (
                    <div className="rounded-lg shadow-lg p-6 border-2 border-red-700 bg-red-50">
                        <div className="flex items-start space-x-3">
                            <TriangleAlert className="text-red-700 flex-shrink-0 mt-1" size={28}/>
                            <div>
                                <h3 className="text-xl font-bold text-red-800 mb-1">NON VALUTABILE ISTOLOGICAMENTE</h3>
                                <p className="text-sm font-semibold text-red-700 mb-2">Struttura arteriosa non identificabile — diagnosi istologica non applicabile</p>
                                <div className="bg-white bg-opacity-60 rounded-md p-3">
                                    <p className="text-sm text-red-800">La classificazione istologica non è possibile in assenza di struttura vascolare. Richiedere nuovo prelievo adeguato.</p>
                                    {scores.clinicalScore >= 40 && (
                                        <p className="text-sm text-blue-800 mt-2 font-medium">Contesto clinico suggestivo (score clinico: {scores.clinicalScore}/100). Considerare eco-Doppler bilaterale, PET-TC o biopsia controlaterale.</p>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>
                )}

                {/* HARD STOP — RED FLAG */}
                {isBlockedRedFlag && (
                    <div className="rounded-lg shadow-lg p-5 border-2 border-red-600 bg-red-50">
                        <div className="flex items-center space-x-2 mb-3">
                            <TriangleAlert className="text-red-700 flex-shrink-0" size={24}/>
                            <h3 className="text-lg font-bold text-red-800">ALERT — PATTERN ORIENTATO VERSO DIAGNOSI ALTERNATIVA</h3>
                        </div>
                        <p className="text-sm text-red-700 mb-3 font-semibold">Reperti inattesi rilevati. Valutazione GCA declassata a secondaria — priorità alla caratterizzazione del reperto inatteso.</p>
                        {redFlags.atypicalLymphoid && (
                            <div className="bg-white rounded-md p-3 mb-2 border-l-4 border-red-500">
                                <p className="font-bold text-red-800 text-sm mb-1">⚠ Sospetto Linfoma Intravascolare</p>
                                <p className="text-xs text-gray-700 mb-2">Cellule linfoidi atipiche intravascolari — escludere linfoma intravascolare B o T.</p>
                                <p className="text-xs font-semibold text-gray-800">IHC urgente: <span className="text-red-700">CD20, CD3, MUM1, Ki67</span></p>
                                <p className="text-xs text-gray-600 mt-1">Profilo CD20+/MUM1+ compatibile con IVLBCL a grandi cellule B — da integrare con morfologia complessiva e pannello esteso se necessario.</p>
                            </div>
                        )}
                        {redFlags.necrotizingGranulomas && (
                            <div className="bg-white rounded-md p-3 mb-2 border-l-4 border-orange-500">
                                <p className="font-bold text-orange-800 text-sm mb-1">⚠ Sospetta Arterite Infettiva</p>
                                <p className="text-xs text-gray-700 mb-2">Granulomi con necrosi centrale — eccezionale in GCA. Escludere TBC e micosi invasive.</p>
                                <p className="text-xs font-semibold text-gray-800">Colorazioni speciali: <span className="text-orange-700">ZN (micobatteri), PAS + GMS (funghi)</span></p>
                            </div>
                        )}
                        {redFlags.necrotizingVasculitis && (
                            <div className="bg-white rounded-md p-3 border-l-4 border-purple-500">
                                <p className="font-bold text-purple-800 text-sm mb-1">⚠ Vasculite Necrotizzante / Pattern Neutrofilico</p>
                                <p className="text-xs text-gray-700 mb-2">Necrosi fibrinoide di parete o infiltrato neutrofilico transmurale — pattern fortemente atipico per GCA classica; in patologia il termine "incompatibile" è riservato alle contraddizioni logiche, non morfologiche.</p>
                                <p className="text-xs font-semibold text-gray-800">DD principale: <span className="text-purple-700">vasculite ANCA-associata (MPA, GPA), PAN</span></p>
                                <p className="text-xs text-gray-600 mt-1">Sierologia: ANCA con differenziazione MPO/PR3.</p>
                            </div>
                        )}
                    </div>
                )}

                {/* CATEGORIA DIAGNOSTICA */}
                {!isBlockedInadequate && !isBlockedRedFlag && (
                    <div className={`rounded-lg shadow-lg p-6 border-2 ${diagnosis.color}`}>
                        <div className="flex items-start space-x-4">
                            <div className="flex-shrink-0 mt-1">{ICONE[diagnosis.icon] || null}</div>
                            <div className="flex-1">
                                <h3 className="text-xl font-bold mb-1">{diagnosis.category}</h3>
                                {diagnosis.driverLabel && <p className="text-sm font-medium mb-1 text-gray-600 italic">{diagnosis.driverLabel}</p>}
                                <p className="text-base font-semibold mb-1">{diagnosis.text}</p>
                                <div className="bg-white bg-opacity-50 rounded-md p-3 mt-3">
                                    <p className="text-sm font-medium">Raccomandazione:</p>
                                    <p className="text-sm mt-1">{diagnosis.recommendation}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                )}

                {/* GCA SECONDARIO */}
                {showSecondaryGCABlock && (
                    <div className="rounded-lg p-4 border border-gray-300 bg-gray-50 opacity-70">
                        <p className="text-xs font-semibold text-gray-500 mb-2 uppercase tracking-wide">Scoring GCA (secondario — vedere alert sopra)</p>
                        <div className={`rounded-md p-3 border ${diagnosis.color}`}>
                            <p className="text-sm font-bold">{diagnosis.category}</p>
                            {diagnosis.driverLabel && <p className="text-xs text-gray-600 italic">{diagnosis.driverLabel}</p>}
                            <p className="text-sm mt-1">{diagnosis.text}</p>
                        </div>
                    </div>
                )}

                {/* ═══ CAMPO REFERTO ═══ */}
                {!isBlockedInadequate && (
                <div className="bg-white rounded-lg shadow-md p-5 border-2 border-indigo-300">
                    <div className="flex items-center justify-between mb-3 border-b pb-2">
                        <h2 className="text-xl font-bold text-indigo-900">📋 Testo Referto</h2>
                        <div className="flex gap-2">
                            {refertoOverride !== null && (
                                <button
                                    onClick={()=>setRefertoOverride(null)}
                                    className="text-xs px-3 py-1.5 bg-yellow-100 hover:bg-yellow-200 text-yellow-800 rounded border border-yellow-300 font-medium"
                                    title="Ripristina il testo auto-generato">
                                    ↺ Rigenera
                                </button>
                            )}
                            <button
                                onClick={()=>{
                                    navigator.clipboard.writeText(refertoText).catch(()=>{
                                        // fallback
                                        const el = document.createElement('textarea');
                                        el.value = refertoText;
                                        document.body.appendChild(el);
                                        el.select();
                                        document.execCommand('copy');
                                        document.body.removeChild(el);
                                    });
                                }}
                                className="text-xs px-3 py-1.5 bg-indigo-100 hover:bg-indigo-200 text-indigo-800 rounded border border-indigo-300 font-medium"
                                title="Copia negli appunti">
                                📋 Copia
                            </button>
                        </div>
                    </div>
                    {refertoOverride !== null && (
                        <p className="text-xs text-yellow-700 bg-yellow-50 border border-yellow-200 rounded px-2 py-1 mb-2">
                            ✏ Testo modificato manualmente. Clicca "Rigenera" per ripristinare il testo automatico.
                        </p>
                    )}
                    {hardInconsistency && (
                        <p className="text-xs text-red-700 bg-red-50 border border-red-200 rounded px-2 py-1 mb-2">
                            ⛔ Incoerenze bloccanti presenti — il referto generato non è affidabile. Correggere prima di utilizzare.
                        </p>
                    )}
                    <textarea
                        value={refertoText}
                        onChange={e => setRefertoOverride(e.target.value)}
                        rows={18}
                        spellCheck={true}
                        className="w-full text-sm font-mono text-gray-800 border border-gray-300 rounded-md p-3 focus:ring-2 focus:ring-indigo-400 resize-y leading-relaxed bg-gray-50"
                        style={{fontFamily:"'Courier New', Courier, monospace", fontSize:'12.5px'}}
                    />
                    <p className="text-xs text-gray-400 mt-1.5 italic">Testo auto-generato dai reperti selezionati — editabile. Non include valori IHC quantitativi (da aggiungere manualmente).</p>
                </div>
                )}
                <div className="bg-white rounded-lg shadow-md p-5">
                    <h2 className="text-xl font-bold text-gray-800 mb-4 border-b pb-2">Riepilogo Reperti</h2>
                    <div className="space-y-2 text-sm">
                        <div className="flex justify-between">
                            <span className="text-gray-700">Reperti maggiori presenti:</span>
                            <span className="font-bold text-red-600">{scores.majorCount}/4</span>
                        </div>
                        <div className="flex justify-between">
                            <span className="text-gray-700">Reperti minori score-positive:</span>
                            <span className="font-bold text-orange-600">{scores.minorCount}/5</span>
                        </div>
                        <div className="flex justify-between">
                            <span className="text-gray-700">DD alert eosinofili:</span>
                            <span className={`font-bold ${minorFindings.eosinophils?'text-amber-600':'text-gray-400'}`}>
                                {minorFindings.eosinophils ? '⚠ PRESENTE' : 'assente'}
                            </span>
                        </div>
                        <div className="flex justify-between">
                            <span className="text-gray-700">Core criteria (CG o granulomatosa):</span>
                            <span className={`font-bold ${scores.hasCoreCriteria?'text-green-600':'text-gray-400'}`}>
                                {scores.hasCoreCriteria ? 'PRESENTE' : 'ASSENTE'}
                            </span>
                        </div>
                        {majorFindings.giantCells && majorFindings.granulomatous && (
                            <div className="text-xs text-amber-700 bg-amber-50 border border-amber-200 rounded px-2 py-1">
                                Damping applicato: granulomatosa → 11 pt (coesistenza con CG)
                            </div>
                        )}
                        <div className="flex justify-between">
                            <span className="text-gray-700">Adeguatezza campione:</span>
                            <span className={`font-bold ${ab.cls}`}>{ab.label}</span>
                        </div>
                        <div className="flex justify-between pt-1 border-t border-gray-100">
                            <span className="text-gray-700">Modalità calcolo:</span>
                            <span className={`font-bold text-xs ${clinicalMode==='none'?'text-red-600':clinicalMode==='partial'?'text-orange-600':'text-indigo-600'}`}>
                                {clinicalMode==='none' ? 'Solo istologia' : clinicalMode==='partial' ? 'Dati parziali (80/20)' : 'Completo (60/40)'}
                            </span>
                        </div>
                    </div>
                    {scores.adequacyLevel==='suboptimal' && <div className="mt-2 p-2 bg-yellow-50 border border-yellow-300 rounded text-xs text-yellow-800">Campione subottimale: refertabile ma con riserva.</div>}
                    {scores.adequacyLevel==='inadequate' && <div className="mt-2 p-2 bg-red-50 border border-red-400 rounded text-xs text-red-800"><strong>Campione non refertabile:</strong> struttura arteriosa non identificabile.</div>}
                    {scores.adequacyLevel==='unknown' && <div className="mt-2 p-2 bg-gray-50 border border-gray-300 rounded text-xs text-gray-700">Dimensioni campione non inserite.</div>}
                </div>

                {/* RACCOMANDAZIONI IHC */}
                {ihcRecs.length > 0 && (
                    <div className="bg-white rounded-lg shadow-md p-5">
                        <h2 className="text-xl font-bold text-gray-800 mb-4 border-b pb-2">Raccomandazioni IHC</h2>
                        {isBlockedInconsistent && (
                            <p className="text-xs text-gray-500 italic bg-gray-50 border border-gray-300 rounded px-2 py-1 mb-3">
                                ⚠ Indicazioni preliminari — subordinate alla correzione delle incoerenze bloccanti.
                            </p>
                        )}
                        <div className="space-y-3">
                            {ihcRecs.map((rec,i)=>(
                                <div key={i} className="border-l-4 border-purple-400 pl-3 py-2 bg-purple-50 rounded-r">
                                    <div className="flex items-center justify-between mb-1">
                                        <span className="font-bold text-gray-800">{rec.marker}</span>
                                        <span className={`text-xs font-semibold px-2 py-1 rounded ${rec.color} ${rec.priority==='ALTA'?'bg-red-100':rec.priority==='MEDIA'?'bg-orange-100':'bg-gray-100'}`}>{rec.priority}</span>
                                    </div>
                                    <p className="text-sm text-gray-700">{rec.reason}</p>
                                </div>
                            ))}
                        </div>
                    </div>
                )}

                {/* PANNELLI IHC STANDARD */}
                <div className="bg-gradient-to-r from-purple-50 to-indigo-50 rounded-lg p-5">
                    <h3 className="font-bold text-purple-900 mb-3">Pannelli IHC Standard</h3>
                    <div className="mb-3 p-2 bg-purple-100 border-l-4 border-purple-600 rounded text-xs text-purple-900 font-medium">
                        L'immunoistochimica può documentare composizione e topografia dell'infiltrato, ma non sostituisce i criteri morfologici su EE/VVG. CD68 identifica macrofagi — non fa diagnosi. Il vetrino colorato con EE e VVG rimane il gold standard.
                    </div>
                    <div className="space-y-3 text-sm">
                        <div className="bg-white rounded-md p-3 border-l-4 border-green-500">
                            <p className="font-bold text-green-800 mb-1">BASE</p>
                            <ul className="text-gray-700 ml-4 space-y-1 text-xs">
                                <li>H&amp;E + VVG (o equivalente) — obbligatorio</li>
                                <li>Campione ≥10 mm, ottimale 15–20 mm</li>
                                <li><strong>CD68</strong> — utile nei casi borderline o poveri di cellule giganti; sensibile ma non specifico</li>
                            </ul>
                        </div>
                        <div className="bg-white rounded-md p-3 border-l-4 border-orange-500">
                            <p className="font-bold text-orange-800 mb-1">COMPLETO (borderline / biopsia sotto steroidi)</p>
                            <ul className="text-gray-700 ml-4 space-y-1 text-xs">
                                <li><strong>CD68 + CD4 + CD8</strong> — distribuzione compartimentale</li>
                                <li><strong>CD20</strong> — solo se infiltrato linfoide atipico o B-rich (non per escludere ANCA; per IgG4 servono morfologia + IgG4/IgG ratio)</li>
                            </ul>
                        </div>
                        <div className="bg-white rounded-md p-3 border-l-4 border-blue-500">
                            <p className="font-bold text-blue-800 mb-1">Performance IHC (letteratura)</p>
                            <ul className="text-gray-700 ml-4 space-y-1 text-xs">
                                <li><strong>CD68:</strong> supporta la documentazione dell'infiltrato macrofagico; sensibile ma non specifico (presente in altre vasculiti granulomatose)</li>
                                <li>Rapporto CD4/CD8: pattern descritto — non criterio diagnostico autonomo (Weyand &amp; Goronzy 2023)</li>
                                <li>CD20 abbondante → riconsiderare diagnosi</li>
                            </ul>
                        </div>
                    </div>
                </div>

                {/* NOTE METODOLOGICHE */}
                <div className="bg-indigo-50 rounded-lg p-5 text-xs">
                    <h3 className="font-bold text-indigo-900 mb-2">Note metodologiche (v3.7)</h3>
                    <ul className="space-y-1 text-indigo-800">
                        <li><strong>[v3.7]</strong> La conclusione del referto era scelta con <code>categoria.includes('DIAGNOSTICA')</code>, vero anche per «NON DIAGNOSTICA»: due categorie su dieci producevano un referto copiabile che diceva «il quadro istologico è diagnostico per GCA» mentre il cartello diceva il contrario. Ora la conclusione segue una chiave esplicita, e un test verifica che la mappa copra tutte le categorie.</li>
                        <li><strong>[v3.7]</strong> La modalità dati clinici non parte più da «Dati completi»: segue i campi effettivamente compilati. In precedenza una GCA istologicamente piena, senza dati clinici inseriti, usciva «BIOPSIA A BASSA CONCORDANZA CON GCA».</li>
                        <li><strong>[v3.7]</strong> L'indice composito dichiara la propria scala: il massimo istologico è 81, non 100 (frammentazione diffusa e focale descrivono la stessa lamina e si escludono).</li>
                        <li><strong>[v3.7]</strong> Frammentazione diffusa (&gt;30%) e focale (&lt;30%) selezionate insieme: ora è un'incoerenza bloccante e i punti non vengono contati due volte. Il ramo «VALUTAZIONE NON AFFIDABILE» era irraggiungibile — i soli warning bloccanti implicavano già l'inadeguatezza del campione.</li>
                        <li><strong>[v3.7]</strong> I reperti inattesi arrivano alla categoria diagnostica, che viene dichiarata subordinata invece di restare invariata nel riquadro secondario.</li>
                        <li><strong>[v3.7]</strong> L'avviso sul declassamento della frammentazione elastica isolata non è più condizionato all'esecuzione della VVG: il declassamento avviene comunque.</li>
                        <li><strong>[v3.7]</strong> Logica estratta in <code>engine.js</code> (nessun DOM) con suite di test Node: pagina e test percorrono la stessa funzione <code>runCase()</code>.</li>
                        <li><strong>[v3.6]</strong> Bug fix: <code>hasArterialStructure</code> spostato prima di <code>canUseElastic</code> — eliminato rischio ReferenceError con VVG selezionata.</li>
                        <li><strong>[v3.6]</strong> Penalità steroidea eliminata: nessuna sottrazione numerica dal composito. Warning interpretativo calibrato sulla durata (positivo sotto steroidi = resta positivo; negativo ≠ esclusione).</li>
                        <li><strong>[v3.6]</strong> Età &lt;50: warning clinico-nosologico obbligatorio — DD prioritaria (Takayasu, ANCA, infettiva, IgG4, sarcoidosi). Non blocca la morfologia.</li>
                        <li><strong>[v3.6]</strong> Vasculite necrotizzante: da "incompatibile" a "fortemente atipico per GCA classica; prioritario escludere...". Più onesto epistemologicamente.</li>
                        <li><strong>[v3.6]</strong> CD20: rimossa affermazione "esclude IgG4/ANCA" — per IgG4 servono morfologia + plasmacellule + IgG4/IgG ratio; ANCA richiede sierologia.</li>
                        <li><strong>[v3.6]</strong> Indice composito ridimensionato visivamente — nota "non validato" in cima alla sezione.</li>
                        <li><strong>[v3.6]</strong> Bibliografia ACR/EULAR corretta: 2022 (non 2023), DOI 10.1002/art.42325 + 10.1136/ard-2022-223480.</li>
                        <li><strong>[v3.5.1]</strong> Frammentazione elastica: scoring differenziato — con infiammazione: 15 pt (diffusa) / 5 pt (focale); senza infiammazione: 3 pt (diffusa) / 2 pt (focale) con warning amber.</li>
                        <li><strong>[v3.5]</strong> Titolo → "Checklist morfologico-clinica"; hard lock categoriale (≥1 maggiore per "altamente suggestivo"); LIMITI nel referto obbligatori.</li>
                        <li><strong>[v3.4]</strong> Modalità dati clinici: Full (60/40) / Parziale (80/20) / Solo istologia (100%). Campo referto auto-generato editabile.</li>
                        <li><strong>Limite epistemologico:</strong> il composito non è una probabilità calibrata. Il giudizio morfologico su EE e VVG prevale sull'algoritmo.</li>
                    </ul>
                </div>
            </div>
            </div>

            {/* BIBLIOGRAFIA */}
            <div className="mt-6 bg-white rounded-lg shadow-md p-6">
                <h2 className="text-2xl font-bold text-gray-800 mb-4 border-b-2 border-indigo-200 pb-2">Bibliografia di Riferimento</h2>
                <div className="space-y-4 text-sm">
                    {(() => {
                        const sectionStyles = {
                            indigo: { title:'text-indigo-900', border:'border-indigo-300', link:'text-indigo-600' },
                            red:    { title:'text-red-900',    border:'border-red-300',    link:'text-red-600'    },
                            purple: { title:'text-purple-900', border:'border-purple-300', link:'text-purple-600' },
                            orange: { title:'text-orange-900', border:'border-orange-300', link:'text-orange-600' },
                            green:  { title:'text-green-900',  border:'border-green-300',  link:'text-green-600'  },
                            blue:   { title:'text-blue-900',   border:'border-blue-300',   link:'text-blue-600'   },
                        };
                        const sections = [
                            {title:'Criteri diagnostici e linee guida', color:'indigo', refs:[
                                {auth:'Ponte C, Martínez-Morillo M, Koster MJ, et al.',year:'2022',title:'2022 ACR/EULAR classification criteria for giant cell arteritis',j:'Arthritis Rheumatol.',vol:'74(12):1881-1889',doi:'10.1002/art.42325'},
                                {auth:'Ponte C, Martínez-Morillo M, Koster MJ, et al.',year:'2022',title:'2022 ACR/EULAR classification criteria for giant cell arteritis',j:'Ann Rheum Dis.',vol:'81(12):1647-1653',doi:'10.1136/ard-2022-223480'},
                                {auth:'Dejaco C, Ramiro S, Duftner C, et al.',year:'2023',title:'EULAR recommendations for imaging in large vessel vasculitis: 2023 update',j:'Ann Rheum Dis.',vol:'82(10):1283-1297',doi:'10.1136/ard-2023-224543'},
                                {auth:'Hellmich B, Agueda A, Monti S, et al.',year:'2020',title:'2018 Update EULAR recommendations large vessel vasculitis',j:'Ann Rheum Dis.',vol:'79(1):19-30',doi:'10.1136/annrheumdis-2019-215672'},
                            ]},
                            {title:'Caratteristiche istopatologiche', color:'red', refs:[
                                {auth:'Watanabe R, Zhang H, Berry GJ, et al.',year:'2024',title:'Immune checkpoint dysfunction in giant cell arteritis',j:'J Exp Med.',vol:'221(5):e20231938',doi:'10.1084/jem.20231938'},
                                {auth:'Generali E, Bozzolo E, Tomelleri A, et al.',year:'2017',title:'CD68+ macrophage infiltration is a hallmark of GCA on temporal artery biopsy',j:'Clin Exp Rheumatol.',vol:'35 Suppl 103(1):S117-S122',doi:'10.3899/jrheum.160499'},
                                {auth:'Stone JH, Tuckwell K, Dimonaco S, et al.',year:'2022',title:'Variability in histopathologic features in GCA and implications for clinical trials',j:'Arthritis Rheumatol.',vol:'74(8):1437-1444',doi:'10.1002/art.42107'},
                            ]},
                            {title:'Immunoistochimica e caratterizzazione immunologica', color:'purple', refs:[
                                {auth:'Weyand CM, Goronzy JJ.',year:'2023',title:'Immunology of giant cell arteritis',j:'Circ Res.',vol:'132(2):238-250',doi:'10.1161/CIRCRESAHA.122.321663'},
                                {auth:'Maleszewski JJ, Younge BR, Fritzlen JT, et al.',year:'2017',title:'Clinical and pathological evolution of GCA: prospective study of follow-up temporal artery biopsies',j:'Mod Pathol.',vol:'30(6):788-796',doi:'10.1038/modpathol.2017.10'},
                                {auth:'van Sleen Y, Wang Q, van der Geest KSM, et al.',year:'2023',title:'Involvement of monocyte subsets in the immunopathology of GCA',j:'Sci Rep.',vol:'13:10388',doi:'10.1038/s41598-023-37376-3'},
                            ]},
                            {title:'Biopsia temporale: tecnica e sensibilità', color:'orange', refs:[
                                {auth:'Ing EB, Lahaie Luna G, Toren A, et al.',year:'2019',title:'Systematic review of the yield of temporal artery biopsy for suspected giant cell arteritis',j:'Neuroophthalmology.',vol:'43(1):18-25',doi:'10.1080/01658107.2018.1474372'},
                                {auth:'Mahr A, Saba M, Kambouchner M, et al.',year:'2006',title:'Temporal artery biopsy for diagnosing GCA: the longer, the better?',j:'Ann Rheum Dis.',vol:'65(6):826-828',doi:'10.1136/ard.2005.040899'},
                            ]},
                            {title:'Imaging e correlazione con istologia', color:'green', refs:[
                                {auth:'Sebastian A, Tomelleri A, Kayani A, et al.',year:'2024',title:'Probability of a positive temporal artery biopsy in suspected GCA: prediction score using ultrasound',j:'Ann Rheum Dis.',vol:'83(2):240-247',doi:'10.1136/ard-2023-224909'},
                                {auth:'Monti S, Floris A, Ponte CB, et al.',year:'2023',title:'The proposed role of ultrasound in the management of GCA in routine clinical practice',j:'Rheumatology (Oxford).',vol:'62(5):1688-1699',doi:'10.1093/rheumatology/keac520'},
                                {auth:'Nielsen BD, Gormsen LC, Hansen IT, et al.',year:'2023',title:'Three days of glucocorticoid treatment attenuates large-vessel FDG uptake in GCA',j:'Eur J Nucl Med Mol Imaging.',vol:'50(5):1245-1256',doi:'10.1007/s00259-022-06066-x'},
                            ]},
                            {title:'Trattamento e stratificazione prognostica', color:'blue', refs:[
                                {auth:'Koster MJ, Matteson EL, Warrington KJ.',year:'2024',title:'Recent advances in the management of giant cell arteritis and Takayasu arteritis',j:'Nat Rev Rheumatol.',vol:'20(2):101-115',doi:'10.1038/s41584-023-01058-z'},
                                {auth:'Cavalli G, Tomelleri A, Campochiaro C, et al.',year:'2023',title:'Serum calprotectin and risk of flare in patients with GCA',j:'Rheumatology (Oxford).',vol:'62(11):3617-3623',doi:'10.1093/rheumatology/kead141'},
                            ]},
                        ];
                        return sections.map(section => {
                            const s = sectionStyles[section.color];
                            return (
                                <div key={section.title}>
                                    <h3 className={`font-bold ${s.title} mb-2`}>{section.title}</h3>
                                    <ul className="space-y-2 text-gray-700">
                                        {section.refs.map((r,i)=>(
                                            <li key={i} className={`pl-4 border-l-2 ${s.border}`}>
                                                <strong>{r.auth}</strong> ({r.year}). {r.title}. <em>{r.j}</em> {r.vol}.
                                                {r.doi && <a href={`https://doi.org/${r.doi}`} target="_blank" rel="noopener noreferrer" className={`${s.link} hover:underline text-xs ml-1`}>DOI</a>}
                                            </li>
                                        ))}
                                    </ul>
                                </div>
                            );
                        });
                    })()}
                    <div className="mt-4 pt-3 border-t-2 border-gray-200">
                        <p className="text-xs text-gray-600 italic"><strong>Nota metodologica:</strong> Scoring euristico — non calcolatore ACR/EULAR 2022. Pesi non validati prospetticamente.</p>
                    </div>
                </div>
            </div>

            {/* FOOTER */}
            <div className="mt-6 bg-white rounded-lg shadow-md p-4">
                <div className="flex flex-col md:flex-row items-center justify-between gap-4">
                    <div className="text-xs text-gray-600">
                        <p>Algoritmo euristico ispirato a criteri ACR/EULAR 2022 — pesi non validati prospetticamente</p>
                        <p className="mt-1">Strumento di supporto — non sostituisce il giudizio clinico-patologico</p>
                        <p className="mt-2 text-indigo-600 font-semibold">v3.7.0 — Settembre 2026</p>
                        <div className="mt-2 pt-2 border-t border-gray-200">
                            <a href="https://github.com/Infingardo/arteriti/blob/main/bigino_vasculiti.pdf" target="_blank" rel="noopener noreferrer" className="text-indigo-600 hover:underline">📄 Bigino vasculiti (PDF)</a>
                        </div>
                    </div>
                    <button onClick={resetAll} className="flex items-center space-x-2 px-5 py-2.5 bg-indigo-100 hover:bg-indigo-200 text-indigo-700 rounded-lg border border-indigo-300 font-medium">
                        <RotateCcw size={18}/><span>Nuovo Caso</span>
                    </button>
                </div>
            </div>
        </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<GCAScorer/>);
</script>
</body>
</html>
