<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklist per la biopsia dell'arteria temporale — consensus SCVP 2023</title>
    <script src="./vendor/react.production.min.js"></script>
    <script src="./vendor/react-dom.production.min.js"></script>
    <script src="./vendor/babel.min.js"></script>
    <script src="./vendor/tailwind.js"></script>
    <script src="./engine.js?v=4.0.0"></script>
    <style>
        body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Roboto','Oxygen','Ubuntu','Cantarell','Fira Sans','Droid Sans','Helvetica Neue',sans-serif; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }
    </style>
</head>
<body>
<div id="root"><div style="padding:40px;font-family:sans-serif;color:#333;text-align:center"><p style="font-size:16px">⏳ Caricamento in corso...</p><p style="font-size:12px;color:#999;margin-top:8px">Il tool usa React + Babel da vendor/. Se questo messaggio persiste oltre 10 secondi, ricaricare la pagina.</p></div></div>
<script>
window.addEventListener('error', function(e){
    document.getElementById('root').innerHTML = '<div style="padding:20px;color:red;font-family:monospace;font-size:12px"><strong>ERRORE JS:</strong><br>' + e.message + '<br>Linea: ' + e.lineno + '</div>';
});
</script>
<script type="text/babel">
    const { useState } = React;

    /* ── ICONE ─────────────────────────────────────────────────────────── */
    const AlertCircle = ({className,size=24}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>;
    const CheckCircle = ({className,size=24}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>;
    const Info = ({className,size=24}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>;
    const RotateCcw = ({className,size=24}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>;
    const TriangleAlert = ({className,size=24}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>;
    const Ban = ({className,size=24}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>;

    /* ── COMPONENTI ─────────────────────────────────────────────────────── */
    // Il motore restituisce una chiave; la scelta del componente e' della pagina.
    const ICONE = {
        alert:    <AlertCircle className="text-red-600"/>,
        check:    <CheckCircle className="text-green-600"/>,
        info:     <Info className="text-yellow-600"/>,
        ban:      <Ban className="text-gray-600"/>,
        triangle: <TriangleAlert className="text-purple-600"/>,
    };

    // Reperto a tre stati: non valutato (nessun pulsante premuto) / assente / presente.
    // Un campo non compilato NON vale "assente".
    const GRADI_UI = [['l','Lieve'],['m','Moderato'],['s','Severo']];
    const Tri = ({id, label, r, setR, gr, setGr, grade, hint}) => {
        const v = r[id];
        const set = (x) => {
            const nuovo = v === x ? undefined : x;
            setR(p => { const n = {...p}; if (nuovo === undefined) delete n[id]; else n[id] = nuovo; return n; });
            if (nuovo !== 'p' && grade) setGr(p => { const n = {...p}; delete n[id]; return n; });
        };
        const setG = (g) => setGr(p => { const n = {...p}; if (n[id] === g) delete n[id]; else n[id] = g; return n; });
        const bt = (on, cls) => `px-2 py-1 text-xs border-r last:border-r-0 ${on ? cls : 'bg-white text-gray-600 hover:bg-gray-50'}`;
        return (
            <div className="py-1.5 border-t border-dotted border-gray-200 first:border-t-0">
                <div className="flex flex-wrap items-center justify-between gap-2">
                    <span className="text-sm text-gray-700 flex-1 min-w-[10rem]">{label}</span>
                    <div className="flex flex-wrap items-center gap-2">
                        {grade && v === 'p' && (
                            <div className="inline-flex border rounded overflow-hidden">
                                {GRADI_UI.map(([g,l]) => <button key={g} type="button" aria-pressed={gr[id]===g} onClick={()=>setG(g)} className={bt(gr[id]===g,'bg-amber-600 text-white')}>{l}</button>)}
                            </div>
                        )}
                        <div className="inline-flex border rounded overflow-hidden">
                            <button type="button" aria-pressed={v==='a'} onClick={()=>set('a')} className={bt(v==='a','bg-teal-700 text-white')}>Assente</button>
                            <button type="button" aria-pressed={v==='p'} onClick={()=>set('p')} className={bt(v==='p','bg-red-700 text-white')}>Presente</button>
                        </div>
                    </div>
                </div>
                {hint && <p className="text-xs text-gray-400 mt-0.5">{hint}</p>}
                {v === undefined && <p className="text-xs text-gray-400 italic">non valutato</p>}
            </div>
        );
    };

    // Scelta singola (toggle): ripremere il pulsante riporta il campo a "non valutato".
    const Scelta = ({label, value, onChange, options}) => (
        <div className="py-1.5 border-t border-dotted border-gray-200 first:border-t-0 flex flex-wrap items-center justify-between gap-2">
            <span className="text-sm text-gray-700 flex-1 min-w-[10rem]">{label}</span>
            <div className="inline-flex border rounded overflow-hidden">
                {options.map(([k,l]) => (
                    <button key={String(k)} type="button" aria-pressed={value===k} onClick={()=>onChange(value===k ? undefined : k)}
                        className={`px-2 py-1 text-xs border-r last:border-r-0 ${value===k ? 'bg-gray-800 text-white' : 'bg-white text-gray-600 hover:bg-gray-50'}`}>{l}</button>
                ))}
            </div>
        </div>
    );
    const SiNo = (p) => <Scelta {...p} options={[[true, p.si || 'Sì'],[false, p.no || 'No']]}/>;

    function Blocco({titolo, children, nota}) {
        return (
            <div className="bg-white rounded-lg shadow-md p-5">
                <h2 className="text-lg font-bold text-gray-800 mb-2 border-b pb-2">{titolo}</h2>
                {nota && <p className="text-xs text-gray-500 mb-2">{nota}</p>}
                {children}
            </div>
        );
    }

    /* ── PAGINA ─────────────────────────────────────────────────────────── */
    function Checklist() {
        const [adeq, setAdeq] = useState({ lunghezza:'', livelli:'', inToto:undefined, elastiche:undefined, livelliAggiuntivi:undefined, struttura:undefined });
        const [r, setR] = useState({});
        const [gr, setGr] = useState({});
        const [iel, setIel] = useState(undefined);
        const [calc, setCalc] = useState(undefined);
        const [rami, setRami] = useState(undefined);
        const [congo, setCongo] = useState(undefined);
        const [igg4, setIgg4] = useState(undefined);
        const [igg4Hpf, setIgg4Hpf] = useState('');
        const [igg4Rapporto, setIgg4Rapporto] = useState('');
        const [ihc, setIhc] = useState({ cd68:false, cd4:false, cd8:false, cd3:false, cd20:false });
        const [redFlags, setRedFlags] = useState({ linfoidiAtipiche:false, granulomiNecrotizzanti:false, vasculiteNecrotizzante:false });
        const [clinica, setClinica] = useState({ eta:'', cortisone:undefined, giorniCortisone:'', ves:'', pcr:'', cefalea:undefined, claudicatio:undefined, visivi:undefined, halo:undefined });
        const [refertoOverride, setRefertoOverride] = useState(null); // null = testo automatico; {text, base} = modificato a mano
        const [importedFrom, setImportedFrom] = useState(null);

        /* ── IMPORTA DATI CLINICI DA FILE JSON (solo contesto) ─────────── */
        const importaDatiClinici = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    const d = JSON.parse(ev.target.result);
                    if (!d._versione || !d._versione.startsWith('GCA-form')) {
                        alert('File non riconosciuto. Assicurarsi di usare il modulo clinico GCA.');
                        return;
                    }
                    const s = d.sintomi || {}, l = d.laboratorio || {}, img = d.imaging || {}, st0 = d.steroidi || {};
                    const eta = d.paziente?.ddn ? Math.floor((new Date() - new Date(d.paziente.ddn)) / 31557600000) : '';
                    // Solo i dati presenti nel file diventano "sì"/"no"; il resto resta non valutato.
                    setClinica({
                        eta:             isNaN(eta) ? '' : String(eta),
                        cefalea:         s.cefalea ? true : undefined,
                        claudicatio:     s.claudicatio ? true : undefined,
                        visivi:          s.visus ? true : undefined,
                        ves:             l.ves || '',
                        pcr:             l.crp || '',
                        halo:            img.haloSign ? true : undefined,
                        cortisone:       st0.siSteroidi ? true : undefined,
                        giorniCortisone: st0.giorni || '',
                    });
                    setImportedFrom({
                        medico:   d.firmaRichiedente || d.paziente?.medico || 'N.D.',
                        paziente: `${d.paziente?.cognome || ''}${d.paziente?.ddn ? ' · ' + d.paziente.ddn : ''}`.trim() || 'N.D.',
                        data:     new Date(d._esportato).toLocaleDateString('it-IT'),
                    });
                } catch(err) {
                    alert('Errore nella lettura del file. File corrotto o formato non valido.');
                }
            };
            reader.readAsText(file);
            e.target.value = '';
        };

        /* ── MOTORE ──────────────────────────────────────────────────────
           Tutta la logica sta in engine.js (nessun DOM, eseguibile da Node con
           `npm test`). Qui restano stato e rendering: la pagina e i test
           percorrono la stessa funzione, runCase(). */
        const st = { adeq, r, gr, iel, calc, rami, congo, igg4, igg4Hpf, igg4Rapporto, ihc, redFlags, clinica };
        const R = runCase(st);
        const refertoText = refertoOverride !== null ? refertoOverride.text : R.referto;
        const refertoObsoleto = refertoOverride !== null && refertoOverride.base !== R.referto;
        const bloccato = R.classe === 'inadeguato';

        const resetAll = () => {
            setAdeq({ lunghezza:'', livelli:'', inToto:undefined, elastiche:undefined, livelliAggiuntivi:undefined, struttura:undefined });
            setR({}); setGr({}); setIel(undefined); setCalc(undefined); setRami(undefined);
            setCongo(undefined); setIgg4(undefined); setIgg4Hpf(''); setIgg4Rapporto('');
            setIhc({ cd68:false, cd4:false, cd8:false, cd3:false, cd20:false });
            setRedFlags({ linfoidiAtipiche:false, granulomiNecrotizzanti:false, vasculiteNecrotizzante:false });
            setClinica({ eta:'', cortisone:undefined, giorniCortisone:'', ves:'', pcr:'', cefalea:undefined, claudicatio:undefined, visivi:undefined, halo:undefined });
            setRefertoOverride(null); setImportedFrom(null);
        };
        const T3 = (id, label, grade, hint) => <Tri id={id} label={label} r={r} setR={setR} gr={gr} setGr={setGr} grade={grade} hint={hint}/>;
        const inp = "w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500";
        const adeguatezzaLabel = R.adeguatezza.conforme === true ? ['Conforme al protocollo del consensus', 'text-green-700']
            : R.adeguatezza.conforme === false ? ['Non conforme al protocollo (vedi criticità)', 'text-amber-700']
            : ['Non determinabile: dati di adeguatezza non completi', 'text-gray-500'];

        /* ── RENDER ──────────────────────────────────────────────────────── */
        return (
        <div className="max-w-6xl mx-auto p-6 bg-gradient-to-br from-blue-50 to-indigo-50 min-h-screen">

            {/* HEADER */}
            <div className="bg-white rounded-lg shadow-xl p-6 mb-6">
                <div className="flex justify-between items-center">
                    <div>
                        <h1 className="text-3xl font-bold text-indigo-900 mb-2">Checklist per la biopsia dell'arteria temporale</h1>
                        <p className="text-gray-600 text-sm">Classificazione qualitativa dei reperti istologici secondo il consensus SCVP 2023 — <em>nessun punteggio</em></p>
                    </div>
                    <button onClick={resetAll} className="flex items-center space-x-2 px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg border border-gray-300" title="Azzera tutti i campi">
                        <RotateCcw size={20}/><span className="font-medium">Reset</span>
                    </button>
                </div>
                <div className="mt-4 p-3 bg-amber-50 border border-amber-300 rounded-md">
                    <p className="text-xs text-amber-800">
                        <strong>Avvertenza metodologica:</strong> la categoria dipende solo dai reperti istologici inseriti; la clinica è contesto e non la modifica mai. La domanda decisiva è se la media è infiammata (nell'asse o in un ramo): in tal caso è arterite attiva, con o senza cellule giganti. Un reperto non compilato è «non valutato», non «assente». La classificazione come arterite a cellule giganti resta clinica. Non implementa i criteri ACR/EULAR 2022. <strong>La diagnosi rimane responsabilità del patologo refertante.</strong>
                    </p>
                </div>
            </div>

            <div className="grid md:grid-cols-2 gap-6">

            {/* ═══ COLONNA SINISTRA: INPUT ═══ */}
            <div className="space-y-6">

                <Blocco titolo="1. Adeguatezza del campione" nota="Protocollo del consensus: incluso in toto, sezioni trasversali a 1-2 mm, almeno 5 livelli, colorazione per le elastiche. Non cambiano la categoria: generano criticità.">
                    <div className="grid grid-cols-2 gap-3 mb-2">
                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">Lunghezza (mm)</label>
                            <input type="number" step="0.5" value={adeq.lunghezza} onChange={e=>setAdeq({...adeq,lunghezza:e.target.value})} className={inp} placeholder="es. 15"/>
                            <p className="text-xs text-gray-400 mt-1">Dato descritto nel referto; nessuna soglia.</p>
                        </div>
                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">Livelli esaminati in EE</label>
                            <input type="number" step="1" min="0" value={adeq.livelli} onChange={e=>setAdeq({...adeq,livelli:e.target.value})} className={inp} placeholder="es. 6"/>
                            <p className="text-xs text-gray-400 mt-1">Consensus: almeno 5.</p>
                        </div>
                    </div>
                    <SiNo label="Struttura arteriosa identificabile (intima, media, avventizia)" value={adeq.struttura} onChange={v=>setAdeq({...adeq,struttura:v})}/>
                    <SiNo label="Incluso in toto, sezionato a 1-2 mm dopo la processazione" value={adeq.inToto} onChange={v=>setAdeq({...adeq,inToto:v})}/>
                    <SiNo label="Colorazione per le elastiche" si="Eseguita" no="Non eseguita" value={adeq.elastiche} onChange={v=>setAdeq({...adeq,elastiche:v})}/>
                    <SiNo label="Livelli aggiuntivi più profondi" si="Eseguiti" no="Non eseguiti" value={adeq.livelliAggiuntivi} onChange={v=>setAdeq({...adeq,livelliAggiuntivi:v})}/>
                    {!bloccato && <p className={`text-xs mt-2 font-medium ${adeguatezzaLabel[1]}`}>{adeguatezzaLabel[0]}</p>}
                </Blocco>

                <Blocco titolo="2. Media" nota="Il reperto decisivo: infiltrato infiammatorio della media, di qualunque grado.">
                    {T3('m_inf','Infiltrato infiammatorio della media', true)}
                    {T3('m_epi','Istiociti epitelioidi')}
                    {T3('m_gig','Cellule giganti', false, 'Utili ma non necessarie; non sufficienti senza infiammazione della media')}
                    {T3('m_nec','Necrosi fibrinoide')}
                    {T3('m_fib','Fibrosi sostitutiva', true)}
                    {T3('m_eos','Eosinofili')}
                    {T3('m_pla','Plasmacellule')}
                    <Scelta label="Rami collaterali nel campione" value={rami} onChange={setRami}
                        options={[['a','Assenti'],['n','Media indenne'],['i','Media infiammata']]}/>
                </Blocco>

                <Blocco titolo="3. Intima ed elastica interna">
                    {T3('i_fib','Ispessimento fibroso intimale', true)}
                    {T3('i_inf','Infiltrato infiammatorio intimale', true)}
                    <Scelta label="Elastica interna" value={iel} onChange={setIel} options={[['c','Conservata'],['f','Frammentata / interrotta']]}/>
                    <p className="text-xs text-gray-400">Rotture focali o multifocali sono comuni anche senza arterite: da sole non indicano arterite attiva.</p>
                    <Scelta label="Calcificazioni" value={calc} onChange={setCalc} options={[['a','Assenti'],['i','Elastica interna'],['m','Media'],['b','Entrambe']]}/>
                </Blocco>

                <Blocco titolo="4. Avventizia e periavventizia" nota="L'infiammazione solo avventiziale è aspecifica e non è arterite attiva: impone livelli più profondi.">
                    {T3('a_inf','Infiltrato infiammatorio cronico', true)}
                    {T3('a_vv','Vasa vasorum coinvolti')}
                    {T3('a_fib','Ispessimento fibroso', true)}
                    {T3('a_neo','Neovasi')}
                </Blocco>

                <Blocco titolo="5. Altri reperti per la diagnosi differenziale">
                    {T3('g_gran','Granulomi')}
                    {T3('g_neu','Neutrofili / microtrombi')}
                    {T3('g_amy','Materiale amorfo eosinofilo')}
                    <Scelta label="Congo red" value={congo} onChange={setCongo} options={[['n','Negativo'],['p','Positivo'],['x','Non eseguito']]}/>
                    {T3('g_tra','Trombo, pseudoaneurisma o duplicazione dell’elastica')}
                    <Scelta label="IgG4 (immunoistochimica)" value={igg4} onChange={setIgg4} options={[['n','Negativa'],['p','Positiva'],['x','Non eseguita']]}/>
                    {igg4 === 'p' && (
                        <div className="grid grid-cols-2 gap-3 mt-1">
                            <div><label className="block text-xs text-gray-600 mb-1">IgG4+ per HPF</label><input type="number" value={igg4Hpf} onChange={e=>setIgg4Hpf(e.target.value)} className={inp}/></div>
                            <div><label className="block text-xs text-gray-600 mb-1">Rapporto IgG4/IgG (%)</label><input type="number" value={igg4Rapporto} onChange={e=>setIgg4Rapporto(e.target.value)} className={inp}/></div>
                        </div>
                    )}
                </Blocco>

                {/* SEGNALI D'ALLARME */}
                <div className="bg-white rounded-lg shadow-md p-5 border-2 border-red-200">
                    <h2 className="text-lg font-bold text-red-800 mb-2 border-b border-red-200 pb-2">⚠ Reperti inattesi (segnali d'allarme)</h2>
                    <p className="text-xs text-red-600 mb-3">Se presenti: la categoria resta, ma è subordinata all'esclusione del pattern alternativo.</p>
                    <div className="space-y-3">
                        {[['linfoidiAtipiche','Cellule linfoidi atipiche intravascolari','Nucleo irregolare/ipercromico nei lumi vascolari o vasa vasorum — anche poche unità sono significative'],
                          ['granulomiNecrotizzanti','Granulomi con necrosi centrale','Necrosi fibrinoide/caseosa al centro dei granulomi — suggestiva di eziologia infettiva'],
                          ['vasculiteNecrotizzante','Vasculite necrotizzante / infiltrato neutrofilico prominente con danno di parete','Necrosi fibrinoide della parete o infiltrato polimorfonucleato transmurale — prioritario escludere vasculite ANCA-associata, PAN, arterite infettiva']
                        ].map(([k,l,d]) => (
                            <label key={k} className="flex items-start space-x-2 cursor-pointer">
                                <input type="checkbox" checked={redFlags[k]} onChange={e=>setRedFlags({...redFlags,[k]:e.target.checked})} className="w-4 h-4 mt-0.5 text-red-600 rounded"/>
                                <span className="text-sm text-gray-700"><strong>{l}</strong><span className="block text-xs text-gray-500 mt-0.5">{d}</span></span>
                            </label>
                        ))}
                    </div>
                </div>

                {/* IHC ESEGUITA */}
                <Blocco titolo="6. Marker IHC eseguiti">
                    <div className="space-y-2">
                        {[['cd68','CD68','macrofagi/cellule giganti'],['cd4','CD4','T helper'],['cd8','CD8','T citotossici'],['cd3','CD3','pan-T'],['cd20','CD20','linfociti B']].map(([key,name,desc]) => (
                            <label key={key} className="flex items-center space-x-2 cursor-pointer">
                                <input type="checkbox" checked={ihc[key]} onChange={e=>setIhc({...ihc,[key]:e.target.checked})} className="w-4 h-4 text-purple-600 rounded"/>
                                <span className="text-sm text-gray-700"><strong>{name}</strong> ({desc})</span>
                            </label>
                        ))}
                    </div>
                    <p className="text-xs text-purple-800 mt-3 p-2 bg-purple-50 rounded">Le IHC sono un supporto: non entrano mai nella categoria.</p>
                </Blocco>

                {/* CONTESTO CLINICO */}
                <div className="bg-gray-50 rounded-lg shadow-inner p-5 border-2 border-dashed border-gray-400">
                    <div className="flex items-center justify-between gap-4 mb-2">
                        <h2 className="text-lg font-bold text-gray-700">7. Contesto clinico</h2>
                        <label className="cursor-pointer px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-md whitespace-nowrap">
                            📂 Importa dati clinici
                            <input type="file" accept=".json" onChange={importaDatiClinici} className="hidden"/>
                        </label>
                    </div>
                    <p className="text-sm font-semibold text-gray-700 bg-white border border-gray-300 rounded px-3 py-2 mb-3">
                        Contesto, non entra nella diagnosi: nessun campo di questa sezione modifica la categoria o la riga di diagnosi. Serve solo per la nota sul cortisone (oltre 7 giorni) e per l'avviso sotto i 50 anni.
                    </p>
                    {importedFrom && (
                        <div className="mb-3 p-2 bg-green-50 border border-green-300 rounded text-xs text-green-800">
                            <p className="font-semibold">✓ Dati clinici importati</p>
                            <p className="mt-0.5">Paziente: <strong>{importedFrom.paziente}</strong> · Medico: <strong>{importedFrom.medico}</strong> · {importedFrom.data}</p>
                            <p className="mt-1 italic text-green-700">Verificare i dati precompilati. I campi assenti nel file restano non valutati.</p>
                        </div>
                    )}
                    <div className="grid grid-cols-2 gap-3 mb-2">
                        <div><label className="block text-sm font-medium text-gray-700 mb-1">Età (anni)</label>
                            <input type="number" value={clinica.eta} onChange={e=>setClinica({...clinica,eta:e.target.value})} className={inp} placeholder="es. 72"/></div>
                        <div><label className="block text-sm font-medium text-gray-700 mb-1">VES (mm/h)</label>
                            <input type="number" value={clinica.ves} onChange={e=>setClinica({...clinica,ves:e.target.value})} className={inp} placeholder="es. 95"/></div>
                    </div>
                    <SiNo label="Cefalea di nuova insorgenza" value={clinica.cefalea} onChange={v=>setClinica({...clinica,cefalea:v})}/>
                    <SiNo label="Claudicatio mascellare" value={clinica.claudicatio} onChange={v=>setClinica({...clinica,claudicatio:v})}/>
                    <SiNo label="Disturbi visivi" value={clinica.visivi} onChange={v=>setClinica({...clinica,visivi:v})}/>
                    <div className="mb-2"><label className="block text-sm font-medium text-gray-700 mb-1">PCR (valore, come da referto di laboratorio)</label>
                        <input type="number" value={clinica.pcr} onChange={e=>setClinica({...clinica,pcr:e.target.value})} className={inp}/></div>
                    <SiNo label="Halo sign ecografico" si="Positivo" no="Negativo" value={clinica.halo} onChange={v=>setClinica({...clinica,halo:v})}/>
                    <SiNo label="Cortisone già iniziato" value={clinica.cortisone} onChange={v=>setClinica({...clinica,cortisone:v})}/>
                    {clinica.cortisone === true && (
                        <div className="ml-4 mt-2">
                            <label className="block text-sm font-medium text-gray-700 mb-1">Giorni dall'inizio del cortisone alla biopsia</label>
                            <input type="number" value={clinica.giorniCortisone} onChange={e=>setClinica({...clinica,giorniCortisone:e.target.value})} className={inp} placeholder="es. 5"/>
                        </div>
                    )}
                </div>
            </div>

            {/* ═══ COLONNA DESTRA: OUTPUT ═══ */}
            <div className="space-y-6">

                {/* CLASSE */}
                <div className={`rounded-lg shadow-lg p-6 border-2 ${R.color}`}>
                    <div className="flex items-start space-x-4">
                        <div className="flex-shrink-0 mt-1">{ICONE[R.icon] || null}</div>
                        <div className="flex-1">
                            <h3 className="text-xl font-bold mb-1">{R.titolo}</h3>
                            {R.subordinata && <p className="text-sm font-semibold text-purple-800 mb-1">Subordinata a DD alternativa (vedi reperti inattesi)</p>}
                            <p className="text-base font-semibold mb-1">{R.diagnosi}</p>
                            {R.nota && <p className="text-sm mt-2">{R.nota}</p>}
                        </div>
                    </div>
                </div>

                {/* REPERTI INATTESI */}
                {!bloccato && (redFlags.linfoidiAtipiche || redFlags.granulomiNecrotizzanti || redFlags.vasculiteNecrotizzante) && (
                    <div className="rounded-lg shadow-lg p-5 border-2 border-red-600 bg-red-50">
                        <div className="flex items-center space-x-2 mb-3">
                            <TriangleAlert className="text-red-700 flex-shrink-0" size={24}/>
                            <h3 className="text-lg font-bold text-red-800">Pattern orientato verso diagnosi alternativa</h3>
                        </div>
                        {redFlags.linfoidiAtipiche && (
                            <div className="bg-white rounded-md p-3 mb-2 border-l-4 border-red-500">
                                <p className="font-bold text-red-800 text-sm mb-1">⚠ Sospetto linfoma intravascolare</p>
                                <p className="text-xs text-gray-700 mb-2">Cellule linfoidi atipiche intravascolari — escludere linfoma intravascolare B o T.</p>
                                <p className="text-xs font-semibold text-gray-800">IHC urgente: <span className="text-red-700">CD20, CD3, MUM1, Ki67</span></p>
                                <p className="text-xs text-gray-600 mt-1">Profilo CD20+/MUM1+ compatibile con linfoma intravascolare B a grandi cellule — da integrare con la morfologia complessiva.</p>
                            </div>
                        )}
                        {redFlags.granulomiNecrotizzanti && (
                            <div className="bg-white rounded-md p-3 mb-2 border-l-4 border-orange-500">
                                <p className="font-bold text-orange-800 text-sm mb-1">⚠ Sospetta arterite infettiva</p>
                                <p className="text-xs text-gray-700 mb-2">Granulomi con necrosi centrale. Escludere TBC e micosi invasive.</p>
                                <p className="text-xs font-semibold text-gray-800">Colorazioni speciali: <span className="text-orange-700">ZN (micobatteri), PAS + GMS (funghi)</span></p>
                            </div>
                        )}
                        {redFlags.vasculiteNecrotizzante && (
                            <div className="bg-white rounded-md p-3 border-l-4 border-purple-500">
                                <p className="font-bold text-purple-800 text-sm mb-1">⚠ Vasculite necrotizzante / pattern neutrofilico</p>
                                <p className="text-xs text-gray-700 mb-2">Necrosi fibrinoide di parete o infiltrato neutrofilico transmurale.</p>
                                <p className="text-xs font-semibold text-gray-800">DD principale: <span className="text-purple-700">vasculite ANCA-associata (MPA, GPA), PAN</span></p>
                                <p className="text-xs text-gray-600 mt-1">Sierologia: ANCA con differenziazione MPO/PR3.</p>
                            </div>
                        )}
                    </div>
                )}

                {/* AVVISI DI CONTESTO */}
                {R.avvisi.length > 0 && (
                    <div className="bg-white rounded-lg shadow-md p-5 border-2 border-amber-400">
                        <h2 className="text-lg font-bold text-amber-800 mb-2">Avviso di contesto clinico</h2>
                        {R.avvisi.map((a,i) => <p key={i} className="text-xs px-3 py-2 rounded border-l-4 bg-yellow-50 border-yellow-500 text-yellow-800">⚠ {a}</p>)}
                        <p className="text-xs text-gray-500 mt-2">Non fa parte del testo del referto.</p>
                    </div>
                )}

                {/* CRITICITÀ */}
                {R.criticita.length > 0 && (
                    <div className="bg-amber-50 rounded-lg shadow-md p-5 border-2 border-amber-500">
                        <h2 className="text-lg font-bold text-amber-900 mb-2">Criticità</h2>
                        <ul className="space-y-1 text-sm text-amber-900 list-disc ml-5">
                            {R.criticita.map((c,i) => <li key={i}>{c}</li>)}
                        </ul>
                        <p className="text-xs text-amber-700 mt-2 italic">Le criticità restano fuori dal testo del referto copiato.</p>
                    </div>
                )}

                {/* TESTO REFERTO */}
                <div className="bg-white rounded-lg shadow-md p-5 border-2 border-indigo-300">
                    <div className="flex items-center justify-between mb-3 border-b pb-2">
                        <h2 className="text-xl font-bold text-indigo-900">📋 Testo referto</h2>
                        <div className="flex gap-2">
                            {refertoOverride !== null && (
                                <button onClick={()=>setRefertoOverride(null)} className="text-xs px-3 py-1.5 bg-yellow-100 hover:bg-yellow-200 text-yellow-800 rounded border border-yellow-300 font-medium" title="Ripristina il testo auto-generato">↺ Rigenera</button>
                            )}
                            <button
                                onClick={()=>{
                                    navigator.clipboard.writeText(refertoText).catch(()=>{
                                        const el = document.createElement('textarea');
                                        el.value = refertoText;
                                        document.body.appendChild(el);
                                        el.select();
                                        document.execCommand('copy');
                                        document.body.removeChild(el);
                                    });
                                }}
                                className="text-xs px-3 py-1.5 bg-indigo-100 hover:bg-indigo-200 text-indigo-800 rounded border border-indigo-300 font-medium" title="Copia negli appunti">📋 Copia</button>
                        </div>
                    </div>
                    {refertoOverride !== null && (
                        <p className="text-xs text-yellow-700 bg-yellow-50 border border-yellow-200 rounded px-2 py-1 mb-2">✏ Testo modificato manualmente. Clicca "Rigenera" per ripristinare il testo automatico.</p>
                    )}
                    {refertoObsoleto && (
                        <p className="text-xs text-red-700 bg-red-50 border border-red-300 rounded px-2 py-1 mb-2">⛔ I reperti sono cambiati dopo la modifica manuale: il testo qui sotto può non coincidere più con la categoria mostrata. Clicca "Rigenera" o ricontrolla il testo.</p>
                    )}
                    <textarea value={refertoText} onChange={e => setRefertoOverride({ text: e.target.value, base: refertoOverride !== null ? refertoOverride.base : R.referto })} rows={16} spellCheck={true}
                        className="w-full text-sm font-mono text-gray-800 border border-gray-300 rounded-md p-3 focus:ring-2 focus:ring-indigo-400 resize-y leading-relaxed bg-gray-50"
                        style={{fontFamily:"'Courier New', Courier, monospace", fontSize:'12.5px'}}/>
                    <p className="text-xs text-gray-400 mt-1.5 italic">Testo generato dai reperti inseriti, modificabile. I campi non valutati sono omessi. I valori segnalati [n] vanno completati a mano.</p>
                </div>

                {/* RACCOMANDAZIONI IHC */}
                {R.ihcRecs.length > 0 && (
                    <div className="bg-white rounded-lg shadow-md p-5">
                        <h2 className="text-xl font-bold text-gray-800 mb-4 border-b pb-2">Suggerimenti IHC (supporto)</h2>
                        <div className="space-y-3">
                            {R.ihcRecs.map((rec,i) => (
                                <div key={i} className="border-l-4 border-purple-400 pl-3 py-2 bg-purple-50 rounded-r">
                                    <div className="flex items-center justify-between mb-1">
                                        <span className="font-bold text-gray-800">{rec.marker}</span>
                                        <span className={`text-xs font-semibold px-2 py-1 rounded ${rec.color} ${rec.priority==='ALTA'?'bg-red-100':rec.priority==='MEDIA'?'bg-orange-100':'bg-gray-100'}`}>{rec.priority}</span>
                                    </div>
                                    <p className="text-sm text-gray-700">{rec.reason}</p>
                                </div>
                            ))}
                        </div>
                    </div>
                )}

                {/* PANNELLI IHC STANDARD */}
                <div className="bg-gradient-to-r from-purple-50 to-indigo-50 rounded-lg p-5">
                    <h3 className="font-bold text-purple-900 mb-3">Pannelli IHC standard</h3>
                    <div className="mb-3 p-2 bg-purple-100 border-l-4 border-purple-600 rounded text-xs text-purple-900 font-medium">
                        L'immunoistochimica può documentare composizione e topografia dell'infiltrato, ma non sostituisce i criteri morfologici su EE e colorazione per le elastiche. CD68 identifica macrofagi — non fa diagnosi.
                    </div>
                    <div className="space-y-3 text-sm">
                        <div className="bg-white rounded-md p-3 border-l-4 border-green-500">
                            <p className="font-bold text-green-800 mb-1">BASE</p>
                            <ul className="text-gray-700 ml-4 space-y-1 text-xs">
                                <li>EE + colorazione per le elastiche — obbligatorie</li>
                                <li><strong>CD68</strong> — utile nei casi poveri di cellule giganti; sensibile ma non specifico</li>
                            </ul>
                        </div>
                        <div className="bg-white rounded-md p-3 border-l-4 border-orange-500">
                            <p className="font-bold text-orange-800 mb-1">COMPLETO (casi dubbi / cortisone prolungato)</p>
                            <ul className="text-gray-700 ml-4 space-y-1 text-xs">
                                <li><strong>CD68 + CD4 + CD8</strong> — distribuzione compartimentale</li>
                                <li><strong>CD20</strong> — solo se infiltrato B-ricco (per IgG4 servono morfologia e rapporto IgG4/IgG)</li>
                            </ul>
                        </div>
                    </div>
                </div>

                {/* NOTE METODOLOGICHE */}
                <div className="bg-indigo-50 rounded-lg p-5 text-xs">
                    <h3 className="font-bold text-indigo-900 mb-2">Note metodologiche (v4.0)</h3>
                    <ul className="space-y-1 text-indigo-800">
                        <li><strong>[v4.0]</strong> Riallineamento al consensus SCVP 2023 (Nair et al.). Eliminati score istologico, score clinico e composito: la categoria è qualitativa.</li>
                        <li><strong>[v4.0]</strong> Media infiammata (asse o ramo), di qualunque grado → A, arterite attiva. Le cellule giganti sono utili ma non necessarie, e non bastano senza infiammazione della media.</li>
                        <li><strong>[v4.0]</strong> La clinica non modifica mai la categoria: è un pannello di contesto (nota sul cortisone oltre 7 giorni, avviso sotto i 50 anni).</li>
                        <li><strong>[v4.0]</strong> Ogni reperto ha tre stati — non valutato, assente, presente. Un campo non compilato non vale «assente».</li>
                        <li><strong>[v4.0]</strong> Rimosse dal referto le raccomandazioni cliniche e le cifre senza fonte. Terminologia: «arterite attiva», «esiti di danno arterioso» (formula prudente: criteri non validati, scarsa riproducibilità).</li>
                        <li><strong>Limite:</strong> i reperti li decide il patologo; lo strumento ne ordina le conseguenze e non sostituisce il giudizio su EE e colorazione per le elastiche.</li>
                    </ul>
                </div>
            </div>
            </div>

            {/* BIBLIOGRAFIA */}
            <div className="mt-6 bg-white rounded-lg shadow-md p-6">
                <h2 className="text-2xl font-bold text-gray-800 mb-4 border-b-2 border-indigo-200 pb-2">Bibliografia di Riferimento</h2>
                <div className="space-y-4 text-sm">
                    {(() => {
                        const sectionStyles = {
                            indigo: { title:'text-indigo-900', border:'border-indigo-300', link:'text-indigo-600' },
                            red:    { title:'text-red-900',    border:'border-red-300',    link:'text-red-600'    },
                            purple: { title:'text-purple-900', border:'border-purple-300', link:'text-purple-600' },
                            orange: { title:'text-orange-900', border:'border-orange-300', link:'text-orange-600' },
                            green:  { title:'text-green-900',  border:'border-green-300',  link:'text-green-600'  },
                            blue:   { title:'text-blue-900',   border:'border-blue-300',   link:'text-blue-600'   },
                        };
                        const sections = [
                            {title:'Criteri diagnostici e linee guida', color:'indigo', refs:[
                                {auth:'Nair V, Fishbein GA, Padera R, et al.',year:'2023',title:'Consensus statement on the processing, interpretation and reporting of temporal artery biopsy for arteritis',j:'Cardiovasc Pathol.',vol:'67:107574',doi:'10.1016/j.carpath.2023.107574'},
                                {auth:'Ponte C, Martínez-Morillo M, Koster MJ, et al.',year:'2022',title:'2022 ACR/EULAR classification criteria for giant cell arteritis',j:'Arthritis Rheumatol.',vol:'74(12):1881-1889',doi:'10.1002/art.42325'},
                                {auth:'Ponte C, Martínez-Morillo M, Koster MJ, et al.',year:'2022',title:'2022 ACR/EULAR classification criteria for giant cell arteritis',j:'Ann Rheum Dis.',vol:'81(12):1647-1653',doi:'10.1136/ard-2022-223480'},
                                {auth:'Dejaco C, Ramiro S, Duftner C, et al.',year:'2023',title:'EULAR recommendations for imaging in large vessel vasculitis: 2023 update',j:'Ann Rheum Dis.',vol:'82(10):1283-1297',doi:'10.1136/ard-2023-224543'},
                                {auth:'Hellmich B, Agueda A, Monti S, et al.',year:'2020',title:'2018 Update EULAR recommendations large vessel vasculitis',j:'Ann Rheum Dis.',vol:'79(1):19-30',doi:'10.1136/annrheumdis-2019-215672'},
                            ]},
                            {title:'Caratteristiche istopatologiche', color:'red', refs:[
                                {auth:'Watanabe R, Zhang H, Berry GJ, et al.',year:'2024',title:'Immune checkpoint dysfunction in giant cell arteritis',j:'J Exp Med.',vol:'221(5):e20231938',doi:'10.1084/jem.20231938'},
                                {auth:'Generali E, Bozzolo E, Tomelleri A, et al.',year:'2017',title:'CD68+ macrophage infiltration is a hallmark of GCA on temporal artery biopsy',j:'Clin Exp Rheumatol.',vol:'35 Suppl 103(1):S117-S122',doi:'10.3899/jrheum.160499'},
                                {auth:'Stone JH, Tuckwell K, Dimonaco S, et al.',year:'2022',title:'Variability in histopathologic features in GCA and implications for clinical trials',j:'Arthritis Rheumatol.',vol:'74(8):1437-1444',doi:'10.1002/art.42107'},
                            ]},
                            {title:'Immunoistochimica e caratterizzazione immunologica', color:'purple', refs:[
                                {auth:'Weyand CM, Goronzy JJ.',year:'2023',title:'Immunology of giant cell arteritis',j:'Circ Res.',vol:'132(2):238-250',doi:'10.1161/CIRCRESAHA.122.321663'},
                                {auth:'Maleszewski JJ, Younge BR, Fritzlen JT, et al.',year:'2017',title:'Clinical and pathological evolution of GCA: prospective study of follow-up temporal artery biopsies',j:'Mod Pathol.',vol:'30(6):788-796',doi:'10.1038/modpathol.2017.10'},
                                {auth:'van Sleen Y, Wang Q, van der Geest KSM, et al.',year:'2023',title:'Involvement of monocyte subsets in the immunopathology of GCA',j:'Sci Rep.',vol:'13:10388',doi:'10.1038/s41598-023-37376-3'},
                            ]},
                            {title:'Biopsia temporale: tecnica e sensibilità', color:'orange', refs:[
                                {auth:'Ing EB, Lahaie Luna G, Toren A, et al.',year:'2019',title:'Systematic review of the yield of temporal artery biopsy for suspected giant cell arteritis',j:'Neuroophthalmology.',vol:'43(1):18-25',doi:'10.1080/01658107.2018.1474372'},
                                {auth:'Mahr A, Saba M, Kambouchner M, et al.',year:'2006',title:'Temporal artery biopsy for diagnosing GCA: the longer, the better?',j:'Ann Rheum Dis.',vol:'65(6):826-828',doi:'10.1136/ard.2005.040899'},
                            ]},
                            {title:'Imaging e correlazione con istologia', color:'green', refs:[
                                {auth:'Sebastian A, Tomelleri A, Kayani A, et al.',year:'2024',title:'Probability of a positive temporal artery biopsy in suspected GCA: prediction score using ultrasound',j:'Ann Rheum Dis.',vol:'83(2):240-247',doi:'10.1136/ard-2023-224909'},
                                {auth:'Monti S, Floris A, Ponte CB, et al.',year:'2023',title:'The proposed role of ultrasound in the management of GCA in routine clinical practice',j:'Rheumatology (Oxford).',vol:'62(5):1688-1699',doi:'10.1093/rheumatology/keac520'},
                                {auth:'Nielsen BD, Gormsen LC, Hansen IT, et al.',year:'2023',title:'Three days of glucocorticoid treatment attenuates large-vessel FDG uptake in GCA',j:'Eur J Nucl Med Mol Imaging.',vol:'50(5):1245-1256',doi:'10.1007/s00259-022-06066-x'},
                            ]},
                            {title:'Trattamento e stratificazione prognostica', color:'blue', refs:[
                                {auth:'Koster MJ, Matteson EL, Warrington KJ.',year:'2024',title:'Recent advances in the management of giant cell arteritis and Takayasu arteritis',j:'Nat Rev Rheumatol.',vol:'20(2):101-115',doi:'10.1038/s41584-023-01058-z'},
                                {auth:'Cavalli G, Tomelleri A, Campochiaro C, et al.',year:'2023',title:'Serum calprotectin and risk of flare in patients with GCA',j:'Rheumatology (Oxford).',vol:'62(11):3617-3623',doi:'10.1093/rheumatology/kead141'},
                            ]},
                        ];
                        return sections.map(section => {
                            const s = sectionStyles[section.color];
                            return (
                                <div key={section.title}>
                                    <h3 className={`font-bold ${s.title} mb-2`}>{section.title}</h3>
                                    <ul className="space-y-2 text-gray-700">
                                        {section.refs.map((r,i)=>(
                                            <li key={i} className={`pl-4 border-l-2 ${s.border}`}>
                                                <strong>{r.auth}</strong> ({r.year}). {r.title}. <em>{r.j}</em> {r.vol}.
                                                {r.doi && <a href={`https://doi.org/${r.doi}`} target="_blank" rel="noopener noreferrer" className={`${s.link} hover:underline text-xs ml-1`}>DOI</a>}
                                            </li>
                                        ))}
                                    </ul>
                                </div>
                            );
                        });
                    })()}
                    <div className="mt-4 pt-3 border-t-2 border-gray-200">
                        <p className="text-xs text-gray-600 italic"><strong>Nota metodologica:</strong> Classificazione qualitativa secondo il consensus SCVP 2023; non è un calcolatore dei criteri ACR/EULAR 2022.</p>
                    </div>
                </div>
            </div>

            {/* FOOTER */}
            <div className="mt-6 bg-white rounded-lg shadow-md p-4">
                <div className="flex flex-col md:flex-row items-center justify-between gap-4">
                    <div className="text-xs text-gray-600">
                        <p>Classificazione qualitativa secondo il consensus SCVP 2023 — non implementa i criteri ACR/EULAR 2022</p>
                        <p className="mt-1">Strumento di supporto — non sostituisce il giudizio clinico-patologico</p>
                        <p className="mt-2 text-indigo-600 font-semibold">v4.0.0 — Ottobre 2026</p>
                        <div className="mt-2 pt-2 border-t border-gray-200">
                            <a href="https://github.com/Infingardo/arteriti/blob/main/bigino_vasculiti.pdf" target="_blank" rel="noopener noreferrer" className="text-indigo-600 hover:underline">📄 Bigino vasculiti (PDF)</a>
                        </div>
                    </div>
                    <button onClick={resetAll} className="flex items-center space-x-2 px-5 py-2.5 bg-indigo-100 hover:bg-indigo-200 text-indigo-700 rounded-lg border border-indigo-300 font-medium">
                        <RotateCcw size={18}/><span>Nuovo caso</span>
                    </button>
                </div>
            </div>
        </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Checklist/>);
</script>
</body>
</html>
